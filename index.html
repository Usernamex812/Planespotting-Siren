<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Aircraft Siren</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
  }

  #map {
    width: 100%;
    height: 65vh;
  }

  #controls {
    padding: 12px;
    background: #181818;
  }

  button {
    font-size: 18px;
    padding: 12px 18px;
    margin: 4px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }

  #start {
    background: #20a020;
    color: white;
  }

  #stop {
    background: #a02020;
    color: white;
  }

  #test {
    background: #444;
    color: white;
  }

  input[type="range"] {
    width: 100%;
  }

  #radiusText {
    font-size: 20px;
    margin: 6px 0;
  }

  #status {
    margin-top: 8px;
    font-size: 16px;
  }

  #stats {
    margin-top: 8px;
    font-size: 15px;
  }

  #aircraftList {
    max-height: 35vh;
    overflow-y: auto;
    background: #101010;
  }

  .aircraft {
    padding: 10px;
    border-bottom: 1px solid #333;
  }

  .aircraft.inside {
    background: #321010;
  }

  .callsign {
    font-size: 19px;
    font-weight: bold;
  }

  .type {
    font-size: 17px;
    margin-top: 2px;
  }

  .details {
    color: #bbb;
    font-size: 14px;
    margin-top: 3px;
  }

  .plane-icon {
    width: 32px;
    height: 32px;
  }

  .plane-icon svg {
    width: 32px;
    height: 32px;
    overflow: visible;
  }

  .leaflet-control-attribution {
    font-size: 9px;
  }
</style>
</head>

<body>

<div id="map"></div>

<div id="controls">

  <button id="start">START MONITORING</button>
  <button id="stop">STOP SIREN</button>
  <button id="test">TEST SIREN</button>

  <div id="radiusText">
    Alert radius: <b><span id="radiusValue">10</span> NM</b>
  </div>

  <input
    id="radius"
    type="range"
    min="1"
    max="250"
    value="10"
    step="1"
  >

  <div id="status">
    Status: stopped
  </div>

  <div id="stats">
    API aircraft: 0 |
    Inside radius: 0 |
    Last update: never
  </div>

</div>

<div id="aircraftList"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const WORKER_URL =
  "https://aircraft-siren-api.evangockerman.workers.dev/";

const UPDATE_INTERVAL = 1000;

let map;
let userMarker;
let radiusCircle;

let monitoring = false;
let updateTimer = null;

let userLat = null;
let userLon = null;

let aircraftMarkers = {};

let audioContext = null;
let sirenOscillator = null;
let sirenGain = null;
let sirenRunning = false;

let currentlyInside = new Set();

let radiusNM = 10;


/* =========================
   MAP
========================= */

function initMap() {

  map = L.map("map").setView(
    [39.96, -83.15],
    9
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);

  getLocation();
}


/* =========================
   LOCATION
========================= */

function getLocation() {

  if (!navigator.geolocation) {

    userLat = 39.96;
    userLon = -83.15;

    drawUserLocation();
    return;
  }

  navigator.geolocation.getCurrentPosition(

    position => {

      userLat = position.coords.latitude;
      userLon = position.coords.longitude;

      drawUserLocation();
    },

    () => {

      // Cincinnati/Hilliard fallback
      userLat = 39.96;
      userLon = -83.15;

      drawUserLocation();
    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 30000
    }
  );
}


/* =========================
   USER LOCATION
========================= */

function drawUserLocation() {

  if (userMarker) {
    map.removeLayer(userMarker);
  }

  if (radiusCircle) {
    map.removeLayer(radiusCircle);
  }

  userMarker = L.circleMarker(
    [userLat, userLon],
    {
      radius: 8,
      color: "white",
      fillColor: "blue",
      fillOpacity: 1
    }
  ).addTo(map);

  radiusCircle = L.circle(
    [userLat, userLon],
    {
      radius: radiusNM * 1852,
      color: "red",
      weight: 2,
      fillColor: "red",
      fillOpacity: 0.08
    }
  ).addTo(map);

  map.setView(
    [userLat, userLon],
    9
  );
}


/* =========================
   DISTANCE
========================= */

function distanceNM(lat1, lon1, lat2, lon2) {

  const R = 3440.065;

  const p1 = lat1 * Math.PI / 180;
  const p2 = lat2 * Math.PI / 180;

  const dLat =
    (lat2 - lat1) * Math.PI / 180;

  const dLon =
    (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dLon / 2) ** 2;

  return 2 * R * Math.asin(
    Math.sqrt(a)
  );
}


/* =========================
   PLANE ICON
========================= */

function planeIcon(
  heading,
  inside
) {

  const color =
    inside ? "#ff3030" : "#2090ff";

  return L.divIcon({

    className: "plane-icon",

    html: `
      <svg
        viewBox="0 0 32 32"
        style="
          transform: rotate(${heading || 0}deg);
          transform-origin: center;
        "
      >

        <path
          d="
            M16 1
            L19 12
            L29 18
            L29 21
            L19 18
            L18 29
            L22 31
            L22 32
            L16 30
            L10 32
            L10 31
            L14 29
            L13 18
            L3 21
            L3 18
            L13 12
            Z
          "
          fill="${color}"
          stroke="white"
          stroke-width="1"
        />

      </svg>
    `,

    iconSize: [32, 32],
    iconAnchor: [16, 16]
  });
}


/* =========================
   AIRCRAFT TYPE
========================= */

function getAircraftType(ac) {

  /*
    ADS-B aircraft type is normally
    contained in "t".

    Examples:
      B738 = Boeing 737-800
      A320 = Airbus A320
      B77W = Boeing 777-300ER
      C172 = Cessna 172
      E75L = Embraer 175
  */

  const type =
    ac.t ||
    ac.typecode ||
    ac.type_code ||
    ac.aircraft_type ||
    ac.model ||
    ac.description;

  if (type) {
    return String(type).trim();
  }

  return "Unknown type";
}


/* =========================
   AIRCRAFT DATA
========================= */

function normalizeAircraft(data) {

  if (Array.isArray(data.ac)) {
    return data.ac;
  }

  if (Array.isArray(data.aircraft)) {
    return data.aircraft;
  }

  if (Array.isArray(data.positions)) {
    return data.positions;
  }

  if (Array.isArray(data.states)) {
    return data.states;
  }

  return [];
}


/* =========================
   FETCH AIRCRAFT
========================= */

async function updateAircraft() {

  if (!monitoring) {
    return;
  }

  if (
    userLat === null ||
    userLon === null
  ) {
    return;
  }

  const requestURL =
    `${WORKER_URL}?lat=${encodeURIComponent(userLat)}` +
    `&lon=${encodeURIComponent(userLon)}` +
    `&dist=250` +
    `&t=${Date.now()}`;

  try {

    const response =
      await fetch(requestURL, {
        cache: "no-store"
      });

    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    const aircraft =
      normalizeAircraft(data);

    processAircraft(aircraft);

    document.getElementById("status").textContent =
      "Status: monitoring";

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "Status: update failed — " +
      error.message;
  }
}


/* =========================
   PROCESS AIRCRAFT
========================= */

function processAircraft(aircraft) {

  const newInside = new Set();

  const list =
    document.getElementById(
      "aircraftList"
    );

  list.innerHTML = "";

  let insideCount = 0;

  for (const ac of aircraft) {

    const lat =
      Number(ac.lat);

    const lon =
      Number(ac.lon);

    if (
      !Number.isFinite(lat) ||
      !Number.isFinite(lon)
    ) {
      continue;
    }

    const id =
      String(
        ac.hex ||
        ac.icao ||
        ac.id ||
        ac.registration ||
        `${lat},${lon}`
      );

    const distance =
      distanceNM(
        userLat,
        userLon,
        lat,
        lon
      );

    const inside =
      distance <= radiusNM;

    if (inside) {

      insideCount++;

      newInside.add(id);
    }

    const heading =
      Number(
        ac.track ||
        ac.heading ||
        ac.true_heading ||
        0
      );

    const callsign =
      (
        ac.flight ||
        ac.callsign ||
        ac.registration ||
        id
      )
      .toString()
      .trim();

    const registration =
      (
        ac.r ||
        ac.registration ||
        "Unknown registration"
      )
      .toString()
      .trim();

    const type =
      getAircraftType(ac);

    const altitude =
      ac.alt_baro ??
      ac.altitude ??
      ac.alt ??
      "Unknown";

    const speed =
      ac.gs ??
      ac.speed ??
      "Unknown";

    /* MAP MARKER */

    if (!aircraftMarkers[id]) {

      aircraftMarkers[id] =
        L.marker(
          [lat, lon],
          {
            icon:
              planeIcon(
                heading,
                inside
              )
          }
        ).addTo(map);

    } else {

      aircraftMarkers[id]
        .setLatLng([lat, lon]);

      aircraftMarkers[id]
        .setIcon(
          planeIcon(
            heading,
            inside
          )
        );
    }

    aircraftMarkers[id].bindPopup(`
      <b>${callsign}</b><br>
      Type: ${type}<br>
      Registration: ${registration}<br>
      Distance: ${distance.toFixed(1)} NM<br>
      Altitude: ${altitude}<br>
      Speed: ${speed} kt
    `);


    /* AIRCRAFT LIST */

    const item =
      document.createElement("div");

    item.className =
      "aircraft" +
      (inside ? " inside" : "");

    item.innerHTML = `

      <div class="callsign">
        ${escapeHTML(callsign)}
      </div>

      <div class="type">
        ${escapeHTML(type)}
      </div>

      <div class="details">
        ${escapeHTML(registration)}
        &nbsp; • &nbsp;
        ${distance.toFixed(1)} NM
        &nbsp; • &nbsp;
        ${escapeHTML(String(altitude))} ft
        &nbsp; • &nbsp;
        ${escapeHTML(String(speed))} kt
      </div>

    `;

    list.appendChild(item);
  }


  /*
    Remove markers for aircraft
    that disappeared from the API.
  */

  const currentIDs =
    new Set(
      aircraft.map(ac =>
        String(
          ac.hex ||
          ac.icao ||
          ac.id ||
          ac.registration ||
          ""
        )
      )
    );

  for (
    const id of Object.keys(aircraftMarkers)
  ) {

    if (!currentIDs.has(id)) {

      map.removeLayer(
        aircraftMarkers[id]
      );

      delete aircraftMarkers[id];
    }
  }


  /*
    SIREN:
    Only start when an aircraft
    transitions from OUTSIDE -> INSIDE.
  */

  let newlyInside = false;

  for (const id of newInside) {

    if (!currentlyInside.has(id)) {

      newlyInside = true;
      break;
    }
  }

  if (
    newlyInside &&
    !sirenRunning
  ) {

    startSiren();
  }

  currentlyInside =
    newInside;


  document.getElementById(
    "stats"
  ).textContent =
    `API aircraft: ${aircraft.length} | ` +
    `Inside radius: ${insideCount} | ` +
    `Last update: ${new Date().toLocaleTimeString()}`;
}


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================
   AUDIO UNLOCK
========================= */

function unlockAudio() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }

  if (
    audioContext.state === "suspended"
  ) {

    audioContext.resume();
  }
}


/* =========================
   START SIREN
========================= */

function startSiren() {

  unlockAudio();

  if (sirenRunning) {
    return;
  }

  sirenRunning = true;

  const ctx = audioContext;

  sirenOscillator =
    ctx.createOscillator();

  sirenGain =
    ctx.createGain();


  /*
    Start low.
  */

  sirenOscillator.type =
    "sine";

  sirenOscillator.frequency.setValueAtTime(
    350,
    ctx.currentTime
  );


  /*
    Slowly rise over several seconds,
    then plateau.
  */

  sirenOscillator.frequency.linearRampToValueAtTime(
    850,
    ctx.currentTime + 4
  );

  sirenOscillator.frequency.setValueAtTime(
    850,
    ctx.currentTime + 4
  );


  /*
    Keep the siren running indefinitely.
  */

  sirenGain.gain.setValueAtTime(
    0.0001,
    ctx.currentTime
  );

  sirenGain.gain.linearRampToValueAtTime(
    0.30,
    ctx.currentTime + 1
  );


  sirenOscillator.connect(
    sirenGain
  );

  sirenGain.connect(
    ctx.destination
  );

  sirenOscillator.start();
}


/* =========================
   STOP SIREN
========================= */

function stopSiren() {

  if (!sirenRunning) {
    return;
  }

  sirenRunning = false;

  const ctx = audioContext;

  if (
    sirenGain &&
    sirenOscillator
  ) {

    sirenGain.gain.cancelScheduledValues(
      ctx.currentTime
    );

    sirenGain.gain.setValueAtTime(
      sirenGain.gain.value,
      ctx.currentTime
    );

    sirenGain.gain.linearRampToValueAtTime(
      0.0001,
      ctx.currentTime + 0.25
    );

    sirenOscillator.stop(
      ctx.currentTime + 0.3
    );
  }

  sirenOscillator = null;
  sirenGain = null;
}


/* =========================
   START MONITORING
========================= */

function startMonitoring() {

  unlockAudio();

  if (monitoring) {
    return;
  }

  monitoring = true;

  currentlyInside.clear();

  document.getElementById(
    "status"
  ).textContent =
    "Status: monitoring";

  updateAircraft();

  /*
    Exactly 1,000 ms between
    polling attempts.
  */

  updateTimer =
    setInterval(
      updateAircraft,
      UPDATE_INTERVAL
    );
}


/* =========================
   STOP MONITORING
========================= */

function stopMonitoring() {

  monitoring = false;

  if (updateTimer) {

    clearInterval(
      updateTimer
    );

    updateTimer = null;
  }

  document.getElementById(
    "status"
  ).textContent =
    "Status: stopped";
}


/* =========================
   RADIUS
========================= */

document.getElementById(
  "radius"
).addEventListener(
  "input",
  event => {

    radiusNM =
      Number(event.target.value);

    document.getElementById(
      "radiusValue"
    ).textContent =
      radiusNM;

    currentlyInside.clear();

    if (radiusCircle) {

      radiusCircle.setRadius(
        radiusNM * 1852
      );
    }
  }
);


/* =========================
   BUTTONS
========================= */

document.getElementById(
  "start"
).addEventListener(
  "click",
  startMonitoring
);

document.getElementById(
  "stop"
).addEventListener(
  "click",
  stopSiren
);

document.getElementById(
  "test"
).addEventListener(
  "click",
  () => {

    unlockAudio();

    if (sirenRunning) {
      stopSiren();
    } else {
      startSiren();
    }
  }
);


/* =========================
   INITIALIZE
========================= */

initMap();

</script>

</body>
</html>
