<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aircraft Siren Radar</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    #panel {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      width: 340px;
      max-width: calc(100% - 24px);
      padding: 15px;
      background: rgba(20,20,20,.95);
      color: white;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }

    #title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #radiusValue {
      font-size: 18px;
      font-weight: bold;
    }

    #radiusSlider {
      width: 100%;
      margin: 8px 0;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 12px;
      margin-top: 7px;
      font-size: 16px;
      font-weight: bold;
    }

    #locationButton {
      background: #1976d2;
      color: white;
    }

    #startButton {
      background: #2e7d32;
      color: white;
    }

    #stopButton {
      background: #555;
      color: white;
    }

    #testButton {
      background: #b71c1c;
      color: white;
    }

    #status,
    #count {
      margin-top: 10px;
      padding: 9px;
      background: rgba(255,255,255,.08);
      border-radius: 8px;
    }

    #alert {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border-radius: 9px;
      background: #d32f2f;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="map"></div>

<div id="panel">

  <div id="title">
    Aircraft Siren Radar
  </div>

  <div>
    Detection radius:
    <span id="radiusValue">25 NM</span>
  </div>

  <input
    id="radiusSlider"
    type="range"
    min="1"
    max="250"
    value="25"
  >

  <button id="locationButton">
    USE MY LOCATION
  </button>

  <button id="testButton">
    TEST SIREN
  </button>

  <button id="startButton">
    START MONITORING
  </button>

  <button id="stopButton">
    STOP MONITORING
  </button>

  <div id="status">
    Waiting for location...
  </div>

  <div id="count">
    Aircraft inside radius: 0
  </div>

  <div id="alert">
    AIRCRAFT ENTERED DETECTION ZONE
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ============================================================
   ONLY AIRCRAFT DATA SOURCE
   ============================================================ */

const AIRCRAFT_API =
  "https://adsbao.dev/api/proxy/aircraft/positions";


/* ============================================================
   SETTINGS
   ============================================================ */

const UPDATE_TIME = 10000;


/* ============================================================
   MAP
   ============================================================ */

const map = L.map("map").setView(
  [39.96, -83.15],
  8
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* ============================================================
   VARIABLES
   ============================================================ */

let latitude = null;
let longitude = null;

let radius = 25;

let locationMarker = null;
let detectionCircle = null;

let aircraftMarkers = new Map();

let aircraftPreviouslyInside = new Set();

let monitoring = false;
let timer = null;

let audio = null;


/* ============================================================
   ELEMENTS
   ============================================================ */

const slider =
  document.getElementById("radiusSlider");

const radiusText =
  document.getElementById("radiusValue");

const status =
  document.getElementById("status");

const count =
  document.getElementById("count");

const alertBox =
  document.getElementById("alert");


/* ============================================================
   RADIUS
   ============================================================ */

slider.addEventListener(
  "input",
  () => {

    radius =
      Number(slider.value);

    radiusText.textContent =
      radius + " NM";

    drawCircle();

  }
);


/* ============================================================
   LOCATION
   ============================================================ */

document
  .getElementById("locationButton")
  .onclick = getLocation;


function getLocation() {

  status.textContent =
    "Getting your location...";

  navigator.geolocation.getCurrentPosition(

    position => {

      latitude =
        position.coords.latitude;

      longitude =
        position.coords.longitude;

      map.setView(
        [latitude, longitude],
        9
      );

      if (locationMarker) {
        map.removeLayer(
          locationMarker
        );
      }

      locationMarker =
        L.marker(
          [latitude, longitude]
        )
        .addTo(map)
        .bindPopup(
          "Your location"
        );

      drawCircle();

      status.textContent =
        "Location ready.";

    },

    error => {

      status.textContent =
        "Location error: " +
        error.message;

    },

    {
      enableHighAccuracy: true,
      maximumAge: 30000,
      timeout: 15000
    }

  );

}


/* ============================================================
   DETECTION CIRCLE
   ============================================================ */

function drawCircle() {

  if (
    latitude === null ||
    longitude === null
  ) {
    return;
  }

  if (detectionCircle) {
    map.removeLayer(
      detectionCircle
    );
  }

  detectionCircle =
    L.circle(
      [latitude, longitude],
      {
        radius: radius * 1852,
        color: "red",
        weight: 2,
        fillOpacity: 0.08
      }
    )
    .addTo(map);

}


/* ============================================================
   DISTANCE
   ============================================================ */

function distanceNM(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 3440.069;

  const radians =
    degrees =>
      degrees * Math.PI / 180;

  const dLat =
    radians(lat2 - lat1);

  const dLon =
    radians(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(radians(lat1)) *
    Math.cos(radians(lat2)) *
    Math.sin(dLon / 2) ** 2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

}


/* ============================================================
   GET AIRCRAFT
   ============================================================ */

async function getAircraft() {

  if (
    latitude === null ||
    longitude === null
  ) {

    status.textContent =
      "Press USE MY LOCATION first.";

    return;

  }

  const url =
    AIRCRAFT_API +
    "/" +
    latitude +
    "/" +
    longitude +
    "/" +
    radius;


  try {

    status.textContent =
      "Getting aircraft...";


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
     * ADSBao/ADSB-style response:
     *
     * {
     *   "ac": [...]
     * }
     */

    const aircraft =
      Array.isArray(data.ac)
        ? data.ac
        : [];


    updateAircraft(
      aircraft
    );


    status.textContent =
      "Live data updated " +
      new Date()
        .toLocaleTimeString();


  }

  catch (error) {

    console.error(error);

    status.textContent =
      "Aircraft API error: " +
      error.message;

  }

}


/* ============================================================
   UPDATE AIRCRAFT
   ============================================================ */

function updateAircraft(
  aircraft
) {

  const insideNow =
    new Set();

  let insideCount = 0;


  for (
    const plane of aircraft
  ) {

    if (
      typeof plane.lat !== "number" ||
      typeof plane.lon !== "number"
    ) {
      continue;
    }


    const id =
      plane.hex ||
      plane.icao24 ||
      (
        plane.lat +
        "," +
        plane.lon
      );


    const distance =
      distanceNM(
        latitude,
        longitude,
        plane.lat,
        plane.lon
      );


    if (
      distance > radius
    ) {

      continue;

    }


    insideCount++;

    insideNow.add(id);


    showAircraft(
      id,
      plane,
      distance
    );


    /*
     * Aircraft wasn't inside on
     * the previous update.
     */

    if (
      !aircraftPreviouslyInside.has(id)
    ) {

      aircraftAlert(
        plane,
        distance
      );

    }

  }


  /*
   * Remove old markers.
   */

  for (
    const [id, marker]
    of aircraftMarkers
  ) {

    if (
      !insideNow.has(id)
    ) {

      map.removeLayer(
        marker
      );

      aircraftMarkers.delete(
        id
      );

    }

  }


  aircraftPreviouslyInside =
    insideNow;


  count.textContent =
    "Aircraft inside radius: " +
    insideCount;

}


/* ============================================================
   AIRCRAFT MARKER
   ============================================================ */

function showAircraft(
  id,
  plane,
  distance
) {

  const heading =
    Number(plane.track) || 0;

  const callsign =
    (
      plane.flight ||
      plane.callsign ||
      "Unknown"
    ).trim();


  const altitude =
    plane.alt_baro ??
    plane.alt_geom ??
    "Unknown";


  const speed =
    plane.gs ??
    "Unknown";


  const popup =

    "<b>" +
    callsign +
    "</b>" +

    "<br>ICAO: " +
    (plane.hex || "Unknown") +

    "<br>Distance: " +
    distance.toFixed(1) +
    " NM" +

    "<br>Altitude: " +
    altitude +
    " ft" +

    "<br>Speed: " +
    speed +
    " kt" +

    "<br>Heading: " +
    heading.toFixed(0) +
    "°";


  if (
    aircraftMarkers.has(id)
  ) {

    const marker =
      aircraftMarkers.get(id);

    marker.setLatLng(
      [plane.lat, plane.lon]
    );

    marker.setPopupContent(
      popup
    );

    const element =
      marker.getElement();

    if (element) {

      const icon =
        element.querySelector(
          ".plane"
        );

      if (icon) {

        icon.style.transform =
          "rotate(" +
          heading +
          "deg)";

      }

    }

    return;

  }


  const icon =
    L.divIcon({

      className:
        "aircraft-icon",

      html:
        `<div
          class="plane"
          style="
            font-size:25px;
            transform:rotate(${heading}deg);
            text-shadow:0 0 4px black;
          "
        >✈</div>`,

      iconSize:
        [30, 30],

      iconAnchor:
        [15, 15]

    });


  const marker =
    L.marker(
      [plane.lat, plane.lon],
      {
        icon
      }
    )
    .addTo(map)
    .bindPopup(
      popup
    );


  aircraftMarkers.set(
    id,
    marker
  );

}


/* ============================================================
   START
   ============================================================ */

document
  .getElementById("startButton")
  .onclick = startMonitoring;


function startMonitoring() {

  if (
    latitude === null ||
    longitude === null
  ) {

    getLocation();

    return;

  }


  if (monitoring) {
    return;
  }


  initializeAudio();


  monitoring = true;


  status.textContent =
    "Monitoring aircraft...";


  getAircraft();


  timer =
    setInterval(
      getAircraft,
      UPDATE_TIME
    );

}


/* ============================================================
   STOP
   ============================================================ */

document
  .getElementById("stopButton")
  .onclick = stopMonitoring;


function stopMonitoring() {

  monitoring = false;


  if (timer) {

    clearInterval(
      timer
    );

    timer = null;

  }


  status.textContent =
    "Monitoring stopped.";

}


/* ============================================================
   AUDIO
   ============================================================ */

function initializeAudio() {

  if (!audio) {

    audio =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if (
    audio.state === "suspended"
  ) {

    audio.resume();

  }

}


/* ============================================================
   SIREN
   ============================================================ */

function playSiren() {

  initializeAudio();


  const oscillator =
    audio.createOscillator();


  const gain =
    audio.createGain();


  oscillator.type =
    "sawtooth";


  oscillator.connect(
    gain
  );


  gain.connect(
    audio.destination
  );


  const now =
    audio.currentTime;


  gain.gain.setValueAtTime(
    0.0001,
    now
  );


  gain.gain.exponentialRampToValueAtTime(
    0.4,
    now + 0.1
  );


  oscillator.start(
    now
  );


  for (
    let i = 0;
    i < 8;
    i++
  ) {

    const start =
      now +
      i * 0.5;


    oscillator.frequency.setValueAtTime(
      550,
      start
    );


    oscillator.frequency.linearRampToValueAtTime(
      1000,
      start + 0.25
    );


    oscillator.frequency.linearRampToValueAtTime(
      550,
      start + 0.5
    );

  }


  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 4.1
  );


  oscillator.stop(
    now + 4.2
  );

}


/* ============================================================
   AIRCRAFT ALERT
   ============================================================ */

function aircraftAlert(
  plane,
  distance
) {

  const callsign =
    (
      plane.flight ||
      plane.callsign ||
      "UNKNOWN"
    ).trim();


  alertBox.textContent =
    "AIRCRAFT ENTERED ZONE — " +
    callsign +
    " — " +
    distance.toFixed(1) +
    " NM";


  alertBox.style.display =
    "block";


  playSiren();


  setTimeout(
    () => {

      alertBox.style.display =
        "none";

    },
    5000
  );

}


/* ============================================================
   TEST BUTTON
   ============================================================ */

document
  .getElementById("testButton")
  .onclick = () => {

    initializeAudio();

    playSiren();

  };

</script>

</body>
</html>
