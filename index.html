<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Aircraft Siren Radar</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#map{
  width:100%;
  height:100%;
}

#panel{
  position:absolute;
  z-index:1000;
  top:12px;
  left:12px;
  width:350px;
  max-width:calc(100% - 24px);
  background:rgba(15,15,15,.95);
  color:white;
  padding:15px;
  border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}

#title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:12px;
}

input{
  width:100%;
}

button{
  width:100%;
  padding:12px;
  margin-top:7px;
  border:0;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
}

#location{
  background:#1976d2;
  color:white;
}

#start{
  background:#2e7d32;
  color:white;
}

#stop{
  background:#555;
  color:white;
}

#test{
  background:#b71c1c;
  color:white;
}

#status,#stats{
  margin-top:10px;
  padding:9px;
  background:rgba(255,255,255,.08);
  border-radius:8px;
  font-size:14px;
}

#alert{
  display:none;
  margin-top:10px;
  padding:12px;
  background:#d32f2f;
  border-radius:9px;
  font-weight:bold;
}

.plane{
  font-size:24px;
  text-shadow:0 0 4px black;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="panel">

<div id="title">
Aircraft Siren Radar
</div>

<div>
Siren radius:
<b><span id="radius">25</span> NM</b>
</div>

<input
  id="slider"
  type="range"
  min="1"
  max="250"
  value="25"
>

<button id="location">
USE MY LOCATION
</button>

<button id="test">
TEST SIREN
</button>

<button id="start">
START MONITORING
</button>

<button id="stop">
STOP MONITORING
</button>

<div id="status">
Waiting for location...
</div>

<div id="stats">
API aircraft: 0<br>
Inside siren radius: 0
</div>

<div id="alert">
AIRCRAFT ENTERED DETECTION ZONE
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ==========================================================
   ADSBAO — THE ONLY AIRCRAFT SOURCE
   ========================================================== */

const ADSBAO =
"https://adsbao.dev/api/proxy/aircraft/positions";


/*
   We deliberately ask ADSBao for 100 NM.

   The user's selected radius is applied locally
   for the siren.
*/

const API_RADIUS = 100;


/* ==========================================================
   MAP
   ========================================================== */

const map =
L.map("map").setView(
  [39.96,-83.15],
  8
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
  maxZoom:19,
  attribution:"© OpenStreetMap contributors"
}
).addTo(map);


/* ==========================================================
   VARIABLES
   ========================================================== */

let lat=null;
let lon=null;

let sirenRadius=25;

let locationMarker=null;
let circle=null;

let markers=new Map();

let previousInside=new Set();

let monitoring=false;

let timer=null;

let audioContext=null;


/* ==========================================================
   ELEMENTS
   ========================================================== */

const radiusText=
document.getElementById("radius");

const slider=
document.getElementById("slider");

const status=
document.getElementById("status");

const stats=
document.getElementById("stats");

const alertBox=
document.getElementById("alert");


/* ==========================================================
   SLIDER
   ========================================================== */

slider.oninput=()=>{

  sirenRadius=
  Number(slider.value);

  radiusText.textContent=
  sirenRadius;

  drawCircle();

};


/* ==========================================================
   LOCATION
   ========================================================== */

document
.getElementById("location")
.onclick=()=>{

  status.textContent=
  "Getting your location...";

  navigator.geolocation.getCurrentPosition(

    p=>{

      lat=
      p.coords.latitude;

      lon=
      p.coords.longitude;

      map.setView(
        [lat,lon],
        9
      );

      if(locationMarker)
        map.removeLayer(locationMarker);

      locationMarker=
      L.marker([lat,lon])
      .addTo(map)
      .bindPopup("Your location");

      drawCircle();

      status.textContent=
      "Location ready.";

    },

    e=>{

      status.textContent=
      "Location error: "+
      e.message;

    },

    {
      enableHighAccuracy:true,
      maximumAge:30000,
      timeout:15000
    }

  );

};


/* ==========================================================
   CIRCLE
   ========================================================== */

function drawCircle(){

  if(lat===null)
    return;

  if(circle)
    map.removeLayer(circle);

  circle=
  L.circle(
    [lat,lon],
    {
      radius:sirenRadius*1852,
      color:"red",
      fillColor:"red",
      fillOpacity:.08,
      weight:2
    }
  ).addTo(map);

}


/* ==========================================================
   DISTANCE
   ========================================================== */

function distanceNM(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R=3440.069;

  const rad=
  x=>x*Math.PI/180;

  const dLat=
  rad(lat2-lat1);

  const dLon=
  rad(lon2-lon1);

  const a=
  Math.sin(dLat/2)**2+
  Math.cos(rad(lat1))*
  Math.cos(rad(lat2))*
  Math.sin(dLon/2)**2;

  return R*
  2*
  Math.atan2(
    Math.sqrt(a),
    Math.sqrt(1-a)
  );

}


/* ==========================================================
   AIRCRAFT REQUEST
   ========================================================== */

async function updateAircraft(){

  if(lat===null){

    status.textContent=
    "Press USE MY LOCATION first.";

    return;

  }


  const url=
  ADSBAO+
  "/"+
  encodeURIComponent(lat)+
  "/"+
  encodeURIComponent(lon)+
  "/"+
  API_RADIUS;


  try{

    status.textContent=
    "Requesting live aircraft...";


    const response=
    await fetch(
      url,
      {
        cache:"no-store"
      }
    );


    const raw=
    await response.text();


    if(!response.ok){

      throw new Error(
        "HTTP "+
        response.status+
        ": "+
        raw.substring(0,200)
      );

    }


    let data;

    try{

      data=
      JSON.parse(raw);

    }catch(e){

      throw new Error(
        "API did not return JSON: "+
        raw.substring(0,200)
      );

    }


    console.log(
      "ADSBao response:",
      data
    );


    /*
      This is the important part.

      We accept the normal "ac" format,
      but also handle common alternate
      aircraft-array names.
    */

    let aircraft=[];


    if(Array.isArray(data.ac))
      aircraft=data.ac;

    else if(Array.isArray(data.aircraft))
      aircraft=data.aircraft;

    else if(Array.isArray(data.positions))
      aircraft=data.positions;

    else if(Array.isArray(data.states))
      aircraft=data.states;


    stats.innerHTML=
    "API aircraft: "+
    aircraft.length+
    "<br>"+
    "Inside siren radius: calculating...";


    processAircraft(
      aircraft
    );


    status.textContent=
    "Live update "+
    new Date().toLocaleTimeString();


  }catch(error){

    console.error(error);

    status.textContent=
    "ADSBao ERROR: "+
    error.message;

    stats.innerHTML=
    "API aircraft: ERROR";

  }

}


/* ==========================================================
   PROCESS AIRCRAFT
   ========================================================== */

function processAircraft(
  aircraft
){

  const inside=
  new Set();

  let count=0;


  for(
    const plane of aircraft
  ){

    /*
      Normal ADS-B position fields.
    */

    const aircraftLat=
      Number(
        plane.lat ??
        plane.latitude
      );

    const aircraftLon=
      Number(
        plane.lon ??
        plane.longitude
      );


    if(
      !Number.isFinite(aircraftLat)||
      !Number.isFinite(aircraftLon)
    ){

      continue;

    }


    const id=
      String(
        plane.hex ??
        plane.icao24 ??
        plane.id ??
        (
          aircraftLat+
          ","+
          aircraftLon
        )
      );


    const distance=
    distanceNM(
      lat,
      lon,
      aircraftLat,
      aircraftLon
    );


    /*
      Show EVERY aircraft returned
      by ADSBao on the map.
    */

    showAircraft(
      id,
      plane,
      aircraftLat,
      aircraftLon,
      distance
    );


    /*
      Siren filtering happens here.
    */

    if(
      distance<=sirenRadius
    ){

      count++;

      inside.add(id);


      if(
        !previousInside.has(id)
      ){

        triggerAlert(
          plane,
          distance
        );

      }

    }

  }


  /*
    Remove aircraft no longer returned.
  */

  for(
    const [id,marker]
    of markers
  ){

    if(
      !aircraft.some(
        p=>
        String(
          p.hex ??
          p.icao24 ??
          p.id ??
          ""
        )===id
      )
    ){

      map.removeLayer(marker);

      markers.delete(id);

    }

  }


  previousInside=
  inside;


  stats.innerHTML=
  "API aircraft: "+
  aircraft.length+
  "<br>"+
  "Inside siren radius: "+
  count;

}


/* ==========================================================
   AIRCRAFT MARKER
   ========================================================== */

function showAircraft(
  id,
  plane,
  aircraftLat,
  aircraftLon,
  distance
){

  const heading=
  Number(
    plane.track ??
    plane.heading ??
    0
  );


  const callsign=
  String(
    plane.flight ??
    plane.callsign ??
    plane.registration ??
    "UNKNOWN"
  ).trim();


  const altitude=
  plane.alt_baro ??
  plane.alt_geom ??
  plane.altitude ??
  "Unknown";


  const speed=
  plane.gs ??
  plane.speed ??
  "Unknown";


  const popup=
  "<b>"+
  callsign+
  "</b>"+
  "<br>ICAO: "+
  (plane.hex||"Unknown")+
  "<br>Distance: "+
  distance.toFixed(1)+
  " NM"+
  "<br>Altitude: "+
  altitude+
  " ft"+
  "<br>Speed: "+
  speed+
  " kt"+
  "<br>Heading: "+
  heading+
  "°";


  if(
    markers.has(id)
  ){

    const marker=
    markers.get(id);

    marker.setLatLng(
      [aircraftLat,aircraftLon]
    );

    marker.setPopupContent(
      popup
    );

    return;

  }


  const icon=
  L.divIcon({

    className:"",

    html:
    `<div
      class="plane"
      style="
        transform:rotate(${heading}deg)
      "
    >✈</div>`,

    iconSize:[30,30],

    iconAnchor:[15,15]

  });


  const marker=
  L.marker(
    [aircraftLat,aircraftLon],
    {icon}
  )
  .addTo(map)
  .bindPopup(popup);


  markers.set(
    id,
    marker
  );

}


/* ==========================================================
   ALERT
   ========================================================== */

function triggerAlert(
  plane,
  distance
){

  const callsign=
  String(
    plane.flight ??
    plane.callsign ??
    "UNKNOWN AIRCRAFT"
  ).trim();


  alertBox.textContent=
  "AIRCRAFT ENTERED ZONE — "+
  callsign+
  " — "+
  distance.toFixed(1)+
  " NM";


  alertBox.style.display=
  "block";


  playSiren();


  setTimeout(
    ()=>{
      alertBox.style.display="none";
    },
    5000
  );

}


/* ==========================================================
   AUDIO
   ========================================================== */

function initAudio(){

  if(!audioContext){

    audioContext=
    new(
      window.AudioContext||
      window.webkitAudioContext
    )();

  }

  if(
    audioContext.state==="suspended"
  ){

    audioContext.resume();

  }

}


function playSiren(){

  initAudio();

  const ctx=
  audioContext;

  const osc=
  ctx.createOscillator();

  const gain=
  ctx.createGain();

  osc.type="sawtooth";

  osc.connect(gain);

  gain.connect(
    ctx.destination
  );

  const now=
  ctx.currentTime;

  gain.gain.setValueAtTime(
    .0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .4,
    now+.1
  );

  osc.start(now);


  for(
    let i=0;
    i<8;
    i++
  ){

    const t=
    now+i*.5;

    osc.frequency.setValueAtTime(
      550,
      t
    );

    osc.frequency.linearRampToValueAtTime(
      1000,
      t+.25
    );

    osc.frequency.linearRampToValueAtTime(
      550,
      t+.5
    );

  }


  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+4.1
  );

  osc.stop(
    now+4.2
  );

}


/* ==========================================================
   BUTTONS
   ========================================================== */

document
.getElementById("test")
.onclick=()=>{

  initAudio();

  playSiren();

};


document
.getElementById("start")
.onclick=()=>{

  if(lat===null){

    status.textContent=
    "Get your location first.";

    return;

  }


  if(monitoring)
    return;


  initAudio();

  monitoring=true;

  updateAircraft();

  timer=
  setInterval(
    updateAircraft,
    10000
  );

};


document
.getElementById("stop")
.onclick=()=>{

  monitoring=false;

  if(timer){

    clearInterval(timer);

    timer=null;

  }

  status.textContent=
  "Monitoring stopped.";

};

</script>

</body>
</html>
