<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aircraft Siren</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

#map {
  width: 100%;
  height: 52vh;
}

#controls {
  padding: 16px;
  background: #181818;
}

h1 {
  margin: 0 0 15px;
}

label {
  display: block;
  margin-bottom: 6px;
}

input[type="range"] {
  width: 100%;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 9px;
  border: 0;
  border-radius: 10px;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

#locationButton {
  background: #2878ff;
}

#enableButton {
  background: #159447;
}

#testButton {
  background: #555;
}

#status {
  margin-top: 14px;
  padding: 12px;
  background: #252525;
  border-radius: 10px;
  line-height: 1.5;
}

#aircraftList {
  margin-top: 12px;
}

.aircraft {
  background: #202020;
  border-radius: 9px;
  padding: 11px;
  margin-bottom: 7px;
}

.alertAircraft {
  border: 2px solid red;
  background: #351010;
}

.approaching {
  border-left: 4px solid orange;
}

.debug {
  color: #aaa;
  font-size: 13px;
  margin-top: 8px;
}

.alert {
  background: #7d1010 !important;
}

.credit {
  margin-top: 18px;
  color: #888;
  font-size: 12px;
  text-align: center;
}

.credit a {
  color: #aaa;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="controls">

<h1>Aircraft Siren</h1>

<label>
Alert radius:
<b><span id="radiusText">25</span> NM</b>
</label>

<input
  id="radius"
  type="range"
  min="1"
  max="250"
  value="25"
>

<label style="margin-top:12px;">
Siren volume:
<b><span id="volumeText">70</span>%</b>
</label>

<input
  id="volume"
  type="range"
  min="0"
  max="100"
  value="70"
>

<button id="locationButton">
Use My Location
</button>

<button id="enableButton">
Enable Siren
</button>

<button id="testButton">
Test Siren
</button>

<div id="status">
Starting...
</div>

<div id="aircraftList"></div>

<div class="credit">
Aircraft data:
<a
  href="https://avioadsb.org/"
  target="_blank"
>
AvioADSB
</a>
· CC BY 4.0
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   WORKER
   ========================================================= */

const WORKER =
"https://aircraft-siren-api.evangockerman.workers.dev/";


/* =========================================================
   SETTINGS
   ========================================================= */

const BUFFER = 5;


/*
   Starting location.

   This gets replaced when you press
   "Use My Location".
*/

let homeLat = 39.96;
let homeLon = -83.15;


/* =========================================================
   VARIABLES
   ========================================================= */

let map;

let homeMarker;

let radiusCircle;

let detectionCircle;

let aircraftMarkers = {};

let previousInside = new Set();

let audioContext = null;

let sirenEnabled = false;

let loading = false;


/* =========================================================
   MAP
   ========================================================= */

map =
L.map("map")
.setView(
  [homeLat, homeLon],
  8
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:
    "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* =========================================================
   GET RADIUS
   ========================================================= */

function getRadius() {

  return Number(
    document
    .getElementById("radius")
    .value
  );

}


/* =========================================================
   DRAW LOCATION + CIRCLES
   ========================================================= */

function drawLocation() {

  const radius =
    getRadius();

  const detectionRadius =
    radius + BUFFER;


  if (homeMarker) {
    map.removeLayer(homeMarker);
  }

  if (radiusCircle) {
    map.removeLayer(radiusCircle);
  }

  if (detectionCircle) {
    map.removeLayer(detectionCircle);
  }


  /*
     CENTER MARKER
  */

  homeMarker =
  L.marker(
    [homeLat, homeLon]
  )
  .addTo(map)
  .bindPopup(
    "Your location"
  );


  /*
     RED CIRCLE

     ACTUAL SIREN ZONE
  */

  radiusCircle =
  L.circle(
    [homeLat, homeLon],
    {
      radius:
        radius * 1852,

      color: "red",

      fillOpacity: 0.08
    }
  )
  .addTo(map);


  /*
     ORANGE CIRCLE

     DETECTION ZONE
  */

  detectionCircle =
  L.circle(
    [homeLat, homeLon],
    {
      radius:
        detectionRadius * 1852,

      color: "orange",

      dashArray:
        "8 8",

      fillOpacity: 0
    }
  )
  .addTo(map);

}


/* =========================================================
   USE LOCATION
   ========================================================= */

document
.getElementById("locationButton")
.addEventListener(
  "click",
  () => {

    setStatus(
      "Getting your location..."
    );

    navigator.geolocation
    .getCurrentPosition(

      position => {

        /*
           THIS IS NOW THE LOCATION
           EVERYTHING IS CALCULATED FROM.
        */

        homeLat =
          position.coords.latitude;

        homeLon =
          position.coords.longitude;


        drawLocation();


        map.setView(
          [homeLat, homeLon],
          9
        );


        /*
           IMPORTANT:

           Clear previous aircraft.

           This prevents aircraft from
           the old location being considered
           aircraft at the new location.
        */

        previousInside.clear();


        Object.keys(
          aircraftMarkers
        ).forEach(
          id => {

            map.removeLayer(
              aircraftMarkers[id]
            );

          }
        );


        aircraftMarkers = {};


        loadAircraft();

      },

      error => {

        setStatus(
          "Location error: " +
          error.message
        );

      },

      {
        enableHighAccuracy: true,

        timeout: 15000,

        maximumAge: 0

      }

    );

  }
);


/* =========================================================
   RADIUS SLIDER
   ========================================================= */

document
.getElementById("radius")
.addEventListener(
  "input",
  () => {

    const radius =
      getRadius();

    document.getElementById(
      "radiusText"
    ).textContent =
      radius;


    drawLocation();


    /*
       Reset entry detection when
       radius changes.
    */

    previousInside.clear();


    loadAircraft();

  }
);


/* =========================================================
   VOLUME
   ========================================================= */

function getVolume() {

  return Number(
    document
    .getElementById("volume")
    .value
  ) / 100;

}


document
.getElementById("volume")
.addEventListener(
  "input",
  () => {

    document.getElementById(
      "volumeText"
    ).textContent =
      document
      .getElementById("volume")
      .value;

  }
);


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text) {

  const status =
    document.getElementById(
      "status"
    );

  status.classList.remove(
    "alert"
  );

  status.innerHTML =
    text;

}


/* =========================================================
   DISTANCE
   ========================================================= */

function distanceNM(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    3440.065;

  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;

  const dLon =
    (lon2 - lon1) *
    Math.PI / 180;


  const a =
    Math.sin(dLat / 2) ** 2 +

    Math.cos(
      lat1 *
      Math.PI / 180
    ) *

    Math.cos(
      lat2 *
      Math.PI / 180
    ) *

    Math.sin(dLon / 2) ** 2;


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}


/* =========================================================
   ENABLE SIREN
   ========================================================= */

async function enableSiren() {

  try {

    if (!audioContext) {

      audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    }

    await audioContext.resume();

    sirenEnabled = true;

    document
    .getElementById(
      "enableButton"
    )
    .textContent =
      "Siren Enabled";


    setStatus(
      "Siren enabled."
    );

  }

  catch (error) {

    setStatus(
      "Audio error: " +
      error.message
    );

  }

}


document
.getElementById("enableButton")
.addEventListener(
  "click",
  enableSiren
);


/* =========================================================
   SIREN
   ========================================================= */

function playSiren() {

  if (!audioContext) {
    return;
  }


  const now =
    audioContext.currentTime;


  const oscillator =
    audioContext.createOscillator();


  const gain =
    audioContext.createGain();


  oscillator.type =
    "sawtooth";


  oscillator.frequency
  .setValueAtTime(
    450,
    now
  );


  oscillator.frequency
  .linearRampToValueAtTime(
    850,
    now + 1.5
  );


  oscillator.frequency
  .linearRampToValueAtTime(
    450,
    now + 3
  );


  oscillator.frequency
  .linearRampToValueAtTime(
    850,
    now + 4.5
  );


  gain.gain
  .setValueAtTime(
    0,
    now
  );


  gain.gain
  .linearRampToValueAtTime(
    getVolume(),
    now + 0.1
  );


  gain.gain
  .setValueAtTime(
    getVolume(),
    now + 4.3
  );


  gain.gain
  .linearRampToValueAtTime(
    0,
    now + 5
  );


  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );


  oscillator.start();

  oscillator.stop(
    now + 5
  );

}


/* =========================================================
   TEST
   ========================================================= */

document
.getElementById("testButton")
.addEventListener(
  "click",
  async () => {

    await enableSiren();

    playSiren();

  }
);


/* =========================================================
   LOAD AIRCRAFT
   ========================================================= */

async function loadAircraft() {

  if (loading) {
    return;
  }

  loading = true;


  try {

    const radius =
      getRadius();


    /*
       ONLY REQUEST:

       radius + 5 NM
    */

    const detectionRadius =
      radius + BUFFER;


    setStatus(
      "Getting aircraft within " +
      detectionRadius +
      " NM..."
    );


    const url =
      WORKER +

      "?lat=" +
      encodeURIComponent(
        homeLat
      ) +

      "&lon=" +
      encodeURIComponent(
        homeLon
      ) +

      "&dist=" +
      encodeURIComponent(
        detectionRadius
      );


    const response =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Worker HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    const aircraft =
      Array.isArray(
        data.aircraft
      )
      ? data.aircraft
      : [];


    displayAircraft(
      aircraft
    );

  }

  catch (error) {

    console.error(error);

    setStatus(
      "<b>ADS-B ERROR</b><br>" +
      error.message
    );

  }


  loading = false;

}


/* =========================================================
   DISPLAY AIRCRAFT
   ========================================================= */

function displayAircraft(
  aircraft
) {

  const radius =
    getRadius();


  const detectionRadius =
    radius + BUFFER;


  const currentInside =
    new Set();


  const activeMarkers =
    new Set();


  const list =
    document.getElementById(
      "aircraftList"
    );


  list.innerHTML = "";


  let detected = 0;

  let alertCount = 0;


  /* =======================================================
     PROCESS FEED
     ======================================================= */

  aircraft.forEach(
    plane => {

      const lat =
        Number(
          plane.lat
        );


      const lon =
        Number(
          plane.lon
        );


      /*
         NO POSITION = IGNORE
      */

      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {

        return;

      }


      const distance =
        distanceNM(
          homeLat,
          homeLon,
          lat,
          lon
        );


      /*
         ABSOLUTE HARD LIMIT

         NOTHING MORE THAN
         RADIUS + 5 NM GETS THROUGH.
      */

      if (
        distance >
        detectionRadius
      ) {

        return;

      }


      detected++;


      /*
         ACTUAL SIREN ZONE
      */

      const inside =
        distance <= radius;


      if (inside) {

        alertCount++;

      }


      const id =
        plane.hex ||
        plane.icao ||
        (
          lat.toFixed(5) +
          "_" +
          lon.toFixed(5)
        );


      activeMarkers.add(
        id
      );


      const callsign =
        String(
          plane.flight ||
          plane.callsign ||
          plane.registration ||
          "Unknown"
        ).trim();


      const altitude =
        plane.alt_baro ??
        "Unknown";


      const speed =
        plane.gs ??
        "Unknown";


      /* ===================================================
         MARKER
         =================================================== */

      if (
        !aircraftMarkers[id]
      ) {

        aircraftMarkers[id] =
          L.marker(
            [lat, lon]
          )
          .addTo(map);

      }
      else {

        aircraftMarkers[id]
        .setLatLng(
          [lat, lon]
        );

      }


      aircraftMarkers[id]
      .bindPopup(

        "<b>" +
        callsign +
        "</b><br><br>" +

        "Distance: " +
        distance.toFixed(1) +
        " NM<br>" +

        "Altitude: " +
        altitude +
        " ft<br>" +

        "Speed: " +
        speed +
        " kt<br><br>" +

        (
          inside
          ? "<b>ALERT ZONE</b>"
          : "5 NM detection buffer"
        )

      );


      /* ===================================================
         LIST
         =================================================== */

      const item =
        document.createElement(
          "div"
        );


      item.className =
        inside
        ? "aircraft alertAircraft"
        : "aircraft approaching";


      item.innerHTML =

        "<strong>" +
        callsign +
        "</strong>" +

        (
          inside
          ? " — ALERT"
          : " — APPROACHING"
        ) +

        "<br>" +

        distance.toFixed(1) +
        " NM · " +

        altitude +
        " ft · " +

        speed +
        " kt";


      list.appendChild(
        item
      );


      /*
         ONLY AIRCRAFT INSIDE
         THE REAL RADIUS ARE
         ADDED TO THIS SET.
      */

      if (inside) {

        currentInside.add(
          id
        );

      }

    }
  );


  /* =======================================================
     REMOVE OLD MARKERS
     ======================================================= */

  Object.keys(
    aircraftMarkers
  ).forEach(
    id => {

      if (
        !activeMarkers.has(id)
      ) {

        map.removeLayer(
          aircraftMarkers[id]
        );

        delete aircraftMarkers[id];

      }

    }
  );


  /* =======================================================
     SIREN ENTRY DETECTION
     ======================================================= */

  const newAircraft =
    [...currentInside]
    .filter(
      id =>
        !previousInside.has(id)
    );


  /*
     THE SIREN CAN ONLY BE
     ACTIVATED BY currentInside.

     currentInside ONLY contains
     aircraft <= the selected radius.
  */

  if (
    sirenEnabled &&
    newAircraft.length > 0
  ) {

    playSiren();


    const status =
      document.getElementById(
        "status"
      );


    status.classList.add(
      "alert"
    );


    status.innerHTML =

      "<b>AIRCRAFT ENTERED ALERT ZONE!</b><br>" +

      newAircraft.length +
      " new aircraft within " +
      radius +
      " NM.";

  }

  else {

    setStatus(

      "<b>" +
      detected +
      "</b> aircraft detected within " +
      detectionRadius +
      " NM<br>" +

      "<b>" +
      alertCount +
      "</b> aircraft inside the " +
      radius +
      " NM alert zone" +

      "<div class='debug'>" +

      "Updated: " +
      new Date()
      .toLocaleTimeString() +

      "</div>"

    );

  }


  previousInside =
    currentInside;

}


/* =========================================================
   INITIALIZE
   ========================================================= */

drawLocation();

loadAircraft();


/* =========================================================
   UPDATE EVERY 10 SECONDS
   ========================================================= */

setInterval(
  loadAircraft,
  10000
);

</script>

</body>
</html>
