<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aircraft Siren</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

#map {
    height: 55vh;
    width: 100%;
}

#controls {
    padding: 15px;
    background: #181818;
}

h1 {
    margin-top: 0;
}

input {
    width: 100%;
    margin: 5px 0 12px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: 0;
    border-radius: 9px;
    font-size: 17px;
    font-weight: bold;
}

#location {
    background: #2878ff;
    color: white;
}

#enable {
    background: #20a060;
    color: white;
}

#test {
    background: #555;
    color: white;
}

#status {
    margin-top: 12px;
    padding: 10px;
    background: #252525;
    border-radius: 8px;
}

.aircraft {
    padding: 10px;
    border-bottom: 1px solid #333;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="controls">

<h1>Aircraft Siren</h1>

<label>Alert radius:
<b><span id="radiusText">25</span> NM</b>
</label>

<input
id="radius"
type="range"
min="1"
max="250"
value="25">

<label>Siren volume:
<b><span id="volumeText">70</span>%</b>
</label>

<input
id="volume"
type="range"
min="0"
max="100"
value="70">

<button id="location">
Use My Location
</button>

<button id="enable">
Enable Siren
</button>

<button id="test">
Test Siren
</button>

<div id="status">
Waiting for location...
</div>

<div id="aircraftList"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const WORKER =
"https://aircraft-siren-api.evangockerman.workers.dev/";


/* =========================
   VARIABLES
========================= */

let homeLat = 39.96;
let homeLon = -83.15;

let map;
let homeMarker;
let radiusCircle;

let aircraftMarkers = {};

let previousAircraft = new Set();

let audioContext = null;
let sirenEnabled = false;


/* =========================
   MAP
========================= */

map = L.map("map").setView(
    [homeLat, homeLon],
    9
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
        "&copy; OpenStreetMap contributors"
    }
).addTo(map);


/* =========================
   LOCATION
========================= */

function setLocation(lat, lon) {

    homeLat = lat;
    homeLon = lon;

    if (homeMarker)
        map.removeLayer(homeMarker);

    if (radiusCircle)
        map.removeLayer(radiusCircle);

    homeMarker =
        L.marker([lat, lon])
        .addTo(map)
        .bindPopup("Your location");

    radiusCircle =
        L.circle(
            [lat, lon],
            {
                radius:
                getRadius() * 1852,

                color: "red",

                fillOpacity: 0.08
            }
        )
        .addTo(map);

    map.setView(
        [lat, lon],
        9
    );

    loadAircraft();
}


document
.getElementById("location")
.addEventListener(
    "click",
    () => {

        navigator.geolocation
        .getCurrentPosition(

            position => {

                setLocation(
                    position.coords.latitude,
                    position.coords.longitude
                );

            },

            error => {

                setStatus(
                    "Location error: " +
                    error.message
                );

            }
        );

    }
);


/* =========================
   RADIUS
========================= */

function getRadius() {

    return Number(
        document.getElementById(
            "radius"
        ).value
    );
}


document
.getElementById("radius")
.addEventListener(
    "input",
    () => {

        const radius =
            getRadius();

        document.getElementById(
            "radiusText"
        ).textContent =
            radius;

        if (radiusCircle) {

            radiusCircle.setRadius(
                radius * 1852
            );

        }

        loadAircraft();

    }
);


/* =========================
   VOLUME
========================= */

function getVolume() {

    return Number(
        document.getElementById(
            "volume"
        ).value
    ) / 100;
}


document
.getElementById("volume")
.addEventListener(
    "input",
    () => {

        document.getElementById(
            "volumeText"
        ).textContent =
            document.getElementById(
                "volume"
            ).value;

    }
);


/* =========================
   AUDIO
========================= */

async function enableSiren() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    await audioContext.resume();

    sirenEnabled = true;

    document.getElementById(
        "enable"
    ).textContent =
        "Siren Enabled";

    setStatus(
        "Siren enabled."
    );
}


document
.getElementById("enable")
.addEventListener(
    "click",
    enableSiren
);


/* =========================
   SIREN
========================= */

function playSiren() {

    if (!audioContext)
        return;

    const now =
        audioContext.currentTime;

    const oscillator =
        audioContext
        .createOscillator();

    const gain =
        audioContext
        .createGain();

    oscillator.type =
        "sawtooth";

    oscillator.frequency
    .setValueAtTime(
        450,
        now
    );

    oscillator.frequency
    .linearRampToValueAtTime(
        850,
        now + 1.5
    );

    oscillator.frequency
    .linearRampToValueAtTime(
        450,
        now + 3
    );

    oscillator.frequency
    .linearRampToValueAtTime(
        850,
        now + 4.5
    );

    gain.gain.setValueAtTime(
        0,
        now
    );

    gain.gain.linearRampToValueAtTime(
        getVolume(),
        now + 0.1
    );

    gain.gain.setValueAtTime(
        getVolume(),
        now + 4.3
    );

    gain.gain.linearRampToValueAtTime(
        0,
        now + 5
    );

    oscillator
    .connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        now + 5
    );
}


document
.getElementById("test")
.addEventListener(
    "click",
    async () => {

        await enableSiren();

        playSiren();

    }
);


/* =========================
   DISTANCE
========================= */

function distanceNM(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 3440.065;

    const dLat =
        (lat2 - lat1)
        * Math.PI / 180;

    const dLon =
        (lon2 - lon1)
        * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) ** 2 +

        Math.cos(
            lat1 * Math.PI / 180
        ) *

        Math.cos(
            lat2 * Math.PI / 180
        ) *

        Math.sin(dLon / 2) ** 2;

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}


/* =========================
   STATUS
========================= */

function setStatus(text) {

    document.getElementById(
        "status"
    ).textContent = text;

}


/* =========================
   LOAD AIRCRAFT
========================= */

async function loadAircraft() {

    try {

        setStatus(
            "Getting live aircraft..."
        );

        const url =
            WORKER +
            "?lat=" +
            homeLat +
            "&lon=" +
            homeLon +
            "&dist=250";

        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Worker returned HTTP " +
                response.status
            );

        }

        const data =
            await response.json();


        /*
        AvioADSB returns
        an aircraft array.
        */

        const aircraft =
            Array.isArray(
                data.aircraft
            )
            ? data.aircraft
            : [];


        displayAircraft(
            aircraft
        );

    }
    catch (error) {

        console.error(error);

        setStatus(
            "ADS-B ERROR: " +
            error.message
        );

    }

}


/* =========================
   DISPLAY AIRCRAFT
========================= */

function displayAircraft(
    aircraft
) {

    const radius =
        getRadius();

    const currentInside =
        new Set();

    const list =
        document.getElementById(
            "aircraftList"
        );

    list.innerHTML = "";

    const activeMarkers =
        new Set();


    aircraft.forEach(
        plane => {

            /*
            Try the common
            AvioADSB coordinate names.
            */

            const lat =
                Number(
                    plane.lat ??
                    plane.latitude
                );

            const lon =
                Number(
                    plane.lon ??
                    plane.longitude
                );


            if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lon)
            ) {
                return;
            }


            const distance =
                distanceNM(
                    homeLat,
                    homeLon,
                    lat,
                    lon
                );


            if (
                distance > radius
            ) {
                return;
            }


            const id =
                plane.hex ||
                plane.icao ||
                plane.icao24 ||
                (
                    lat.toFixed(4) +
                    "_" +
                    lon.toFixed(4)
                );


            currentInside.add(id);

            activeMarkers.add(id);


            /* MARKER */

            if (
                !aircraftMarkers[id]
            ) {

                aircraftMarkers[id] =
                    L.marker(
                        [lat, lon]
                    )
                    .addTo(map);

            }
            else {

                aircraftMarkers[id]
                .setLatLng(
                    [lat, lon]
                );

            }


            const callsign =
                (
                    plane.flight ||
                    plane.callsign ||
                    plane.registration ||
                    "Unknown"
                ).trim();


            const altitude =
                plane.alt_baro ??
                plane.altitude ??
                plane.alt ??
                "Unknown";


            const speed =
                plane.gs ??
                plane.speed ??
                "Unknown";


            aircraftMarkers[id]
            .bindPopup(

                "<b>" +
                callsign +
                "</b><br>" +

                "Distance: " +
                distance.toFixed(1) +
                " NM<br>" +

                "Altitude: " +
                altitude +
                "<br>" +

                "Speed: " +
                speed

            );


            /* LIST */

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "aircraft";

            item.innerHTML =

                "<b>" +
                callsign +
                "</b><br>" +

                distance.toFixed(1) +
                " NM · " +

                altitude +
                " ft";


            list.appendChild(
                item
            );

        }
    );


    /* REMOVE OLD MARKERS */

    Object.keys(
        aircraftMarkers
    ).forEach(
        id => {

            if (
                !activeMarkers.has(id)
            ) {

                map.removeLayer(
                    aircraftMarkers[id]
                );

                delete aircraftMarkers[id];

            }

        }
    );


    /* SIREN */

    if (sirenEnabled) {

        const newAircraft =
            [...currentInside]
            .filter(
                id =>
                    !previousAircraft
                    .has(id)
            );

        if (
            newAircraft.length > 0
        ) {

            playSiren();

            setStatus(
                "AIRCRAFT ENTERED ALERT ZONE!"
            );

        }

    }


    previousAircraft =
        currentInside;


    setStatus(
        currentInside.size +
        " aircraft within " +
        radius +
        " NM"
    );

}


/* =========================
   START
========================= */

setLocation(
    homeLat,
    homeLon
);

setInterval(
    loadAircraft,
    10000
);

</script>

</body>
</html>
