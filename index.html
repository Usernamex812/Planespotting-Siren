<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aircraft Siren</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100%;
}

/* Control panel */

#panel {
  position: absolute;
  z-index: 1000;

  top: 10px;
  left: 10px;

  width: 310px;

  background: rgba(255,255,255,0.96);

  padding: 15px;

  border-radius: 14px;

  box-shadow:
    0 3px 15px rgba(0,0,0,0.3);
}

#panel h2 {
  margin: 0 0 12px 0;
}

#radiusText {
  font-size: 18px;
  font-weight: bold;
}

#radius {
  width: 100%;
  margin: 10px 0;
}

button {
  width: 100%;

  padding: 11px;

  margin-top: 7px;

  border: none;
  border-radius: 8px;

  background: #222;
  color: white;

  font-size: 16px;
}

button:active {
  transform: scale(0.98);
}

#status {
  margin-top: 12px;

  padding: 8px;

  border-radius: 7px;

  background: #eee;

  font-weight: bold;
}

#stats {
  margin-top: 8px;

  font-size: 13px;

  line-height: 1.5;
}

#error {
  margin-top: 8px;

  color: #b00020;

  font-size: 12px;

  word-break: break-word;
}

/*
  AIRCRAFT ICON
*/

.aircraft-icon {
  width: 32px;
  height: 32px;

  display: flex;

  align-items: center;
  justify-content: center;

  transform-origin: center center;
}

.aircraft-symbol {
  width: 30px;
  height: 30px;

  filter:
    drop-shadow(0 1px 2px rgba(0,0,0,0.7));
}

/*
  User location marker
*/

.user-icon {
  width: 18px;
  height: 18px;

  background: #1677ff;

  border: 3px solid white;

  border-radius: 50%;

  box-shadow:
    0 1px 5px rgba(0,0,0,0.5);
}

</style>
</head>

<body>

<div id="panel">

  <h2>Aircraft Siren</h2>

  <div>
    Siren radius:
    <span id="radiusText">25 NM</span>
  </div>

  <input
    id="radius"
    type="range"
    min="1"
    max="250"
    value="25"
  >

  <button id="locationButton">
    Use My Location
  </button>

  <button id="startButton">
    Start Monitoring
  </button>

  <button id="stopButton">
    Stop Monitoring
  </button>

  <button id="testButton">
    Test Siren
  </button>

  <div id="status">
    Loading...
  </div>

  <div id="stats">
    API aircraft: 0<br>
    Inside siren radius: 0
  </div>

  <div id="error"></div>

</div>

<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   SETTINGS
   ========================================================= */

const WORKER =
  "https://aircraft-siren-api.evangockerman.workers.dev/";

const API_RADIUS = 100;

const UPDATE_INTERVAL = 10000;


/* =========================================================
   VARIABLES
   ========================================================= */

let latitude = 39.96;
let longitude = -83.15;

let monitoring = false;

let updateTimer = null;

let previousAircraft = new Set();

let userMarker = null;

let radiusCircle = null;


/* =========================================================
   MAP
   ========================================================= */

const map = L.map("map").setView(
  [latitude, longitude],
  9
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,

    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* =========================================================
   AIRCRAFT LAYER
   ========================================================= */

const aircraftLayer =
  L.layerGroup().addTo(map);


/* =========================================================
   PANEL ELEMENTS
   ========================================================= */

const radiusSlider =
  document.getElementById("radius");

const radiusText =
  document.getElementById("radiusText");

const status =
  document.getElementById("status");

const stats =
  document.getElementById("stats");

const errorBox =
  document.getElementById("error");


/* =========================================================
   RADIUS
   ========================================================= */

function updateRadiusCircle() {

  const radiusNM =
    Number(radiusSlider.value);

  radiusText.textContent =
    radiusNM + " NM";

  if (!radiusCircle) {

    radiusCircle =
      L.circle(
        [latitude, longitude],
        {
          radius: radiusNM * 1852,

          color: "#0066ff",

          weight: 3,

          fillColor: "#3388ff",

          fillOpacity: 0.08
        }
      ).addTo(map);

  } else {

    radiusCircle.setLatLng([
      latitude,
      longitude
    ]);

    radiusCircle.setRadius(
      radiusNM * 1852
    );
  }
}


radiusSlider.addEventListener(
  "input",
  updateRadiusCircle
);


/* =========================================================
   USER LOCATION ICON
   ========================================================= */

const userIcon =
  L.divIcon({

    className: "",

    html:
      '<div class="user-icon"></div>',

    iconSize: [24,24],

    iconAnchor: [12,12]
  });


/* =========================================================
   UPDATE USER MARKER
   ========================================================= */

function updateUserMarker() {

  if (!userMarker) {

    userMarker =
      L.marker(
        [latitude, longitude],
        {
          icon: userIcon
        }
      )
      .addTo(map)
      .bindPopup(
        "Your location"
      );

  } else {

    userMarker.setLatLng([
      latitude,
      longitude
    ]);
  }

  updateRadiusCircle();
}


/* =========================================================
   DISTANCE
   ========================================================= */

function distanceNM(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 3440.065;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;

  const dLon =
    (lon2 - lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +

    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dLon / 2) ** 2;

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/* =========================================================
   AIRCRAFT SVG
   ========================================================= */

function aircraftSVG(
  heading,
  inside
) {

  /*
    Nose of airplane points UP.

    CSS rotates the entire icon
    according to aircraft heading.
  */

  const rotation =
    Number.isFinite(heading)
      ? heading
      : 0;

  const fill =
    inside
      ? "#ff2020"
      : "#0066ff";

  return `
    <div
      class="aircraft-icon"
      style="transform: rotate(${rotation}deg);"
    >

      <svg
        class="aircraft-symbol"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
      >

        <!-- fuselage -->

        <path
          d="
            M50 4
            C45 8 44 17 43 30
            L40 48
            L15 64
            L13 72
            L42 63
            L44 90
            L34 96
            L34 100
            L50 94
            L66 100
            L66 96
            L56 90
            L58 63
            L87 72
            L85 64
            L60 48
            L57 30
            C56 17 55 8 50 4
            Z
          "

          fill="${fill}"

          stroke="#ffffff"

          stroke-width="4"

          stroke-linejoin="round"
        />

      </svg>

    </div>
  `;
}


/* =========================================================
   AIRCRAFT ICON CREATOR
   ========================================================= */

function makeAircraftIcon(
  heading,
  inside
) {

  return L.divIcon({

    className: "",

    html:
      aircraftSVG(
        heading,
        inside
      ),

    iconSize: [32,32],

    iconAnchor: [16,16],

    popupAnchor: [0,-16]
  });
}


/* =========================================================
   SIREN
   ========================================================= */

let audioContext = null;


function playSiren() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }

  if (
    audioContext.state ===
    "suspended"
  ) {

    audioContext.resume();
  }

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type =
    "sawtooth";

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  gain.gain.value =
    0.15;

  const start =
    audioContext.currentTime;

  oscillator.start(start);

  for (
    let i = 0;
    i < 8;
    i++
  ) {

    const t =
      start + i * 1.2;

    oscillator
      .frequency
      .setValueAtTime(
        500,
        t
      );

    oscillator
      .frequency
      .linearRampToValueAtTime(
        1000,
        t + 0.6
      );

    oscillator
      .frequency
      .linearRampToValueAtTime(
        500,
        t + 1.2
      );
  }

  oscillator.stop(
    start + 9.6
  );
}


/* =========================================================
   GET LOCATION
   ========================================================= */

function getLocation() {

  status.textContent =
    "Getting your location...";

  errorBox.textContent = "";

  if (
    !navigator.geolocation
  ) {

    status.textContent =
      "Location unavailable.";

    fetchAircraft();

    return;
  }

  navigator.geolocation.getCurrentPosition(

    position => {

      latitude =
        position.coords.latitude;

      longitude =
        position.coords.longitude;

      updateUserMarker();

      map.setView(
        [latitude, longitude],
        9
      );

      status.textContent =
        "Location found.";

      fetchAircraft();
    },

    error => {

      status.textContent =
        "Using default location.";

      updateUserMarker();

      fetchAircraft();
    },

    {
      enableHighAccuracy: true,

      timeout: 10000,

      maximumAge: 60000
    }
  );
}


/* =========================================================
   GET AIRCRAFT
   ========================================================= */

async function fetchAircraft() {

  try {

    errorBox.textContent = "";

    status.textContent =
      monitoring
        ? "Updating aircraft..."
        : "Loading aircraft...";


    const url =
      WORKER +
      "?lat=" +
      encodeURIComponent(
        latitude
      ) +
      "&lon=" +
      encodeURIComponent(
        longitude
      ) +
      "&dist=" +
      API_RADIUS;


    console.log(
      "Aircraft request:",
      url
    );


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Worker HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    console.log(
      "Aircraft data:",
      data
    );


    if (data.error) {

      throw new Error(
        data.error
      );
    }


    /* -----------------------------------------
       Find aircraft array
       ----------------------------------------- */

    let aircraft = [];


    if (
      Array.isArray(data.ac)
    ) {

      aircraft =
        data.ac;

    } else if (
      Array.isArray(data.aircraft)
    ) {

      aircraft =
        data.aircraft;

    } else if (
      Array.isArray(data.positions)
    ) {

      aircraft =
        data.positions;

    } else if (
      Array.isArray(data.states)
    ) {

      aircraft =
        data.states;
    }


    /* -----------------------------------------
       Clear old aircraft
       ----------------------------------------- */

    aircraftLayer.clearLayers();


    let insideCount = 0;

    const currentAircraft =
      new Set();


    /* -----------------------------------------
       Process planes
       ----------------------------------------- */

    for (
      const plane of aircraft
    ) {

      const lat =
        Number(
          plane.lat ??
          plane.latitude
        );


      const lon =
        Number(
          plane.lon ??
          plane.longitude
        );


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {

        continue;
      }


      const distance =
        distanceNM(
          latitude,
          longitude,
          lat,
          lon
        );


      const selectedRadius =
        Number(
          radiusSlider.value
        );


      const inside =
        distance <=
        selectedRadius;


      if (inside) {

        insideCount++;
      }


      /* ---------------------------------------
         Aircraft ID
         --------------------------------------- */

      const id =
        String(
          plane.hex ??
          plane.icao ??
          plane.icao24 ??
          plane.flight ??
          (
            lat.toFixed(4) +
            "," +
            lon.toFixed(4)
          )
        );


      currentAircraft.add(id);


      /* ---------------------------------------
         Heading
         --------------------------------------- */

      let heading =
        Number(
          plane.track ??
          plane.heading ??
          plane.true_track ??
          plane.direction
        );


      if (
        !Number.isFinite(heading)
      ) {

        heading = 0;
      }


      /* ---------------------------------------
         Aircraft information
         --------------------------------------- */

      const callsign =
        (
          plane.flight ??
          plane.callsign ??
          plane.r ??
          plane.hex ??
          plane.icao ??
          "Unknown"
        )
        .toString()
        .trim();


      const altitude =
        plane.alt_baro ??
        plane.altitude ??
        plane.alt ??
        plane.alt_geom ??
        "Unknown";


      const speed =
        plane.gs ??
        plane.speed ??
        plane.velocity ??
        "Unknown";


      const squawk =
        plane.squawk ??
        "Unknown";


      /* ---------------------------------------
         Marker
         --------------------------------------- */

      const marker =
        L.marker(
          [lat, lon],
          {
            icon:
              makeAircraftIcon(
                heading,
                inside
              )
          }
        )
        .addTo(
          aircraftLayer
        );


      marker.bindPopup(`

        <div style="font-size:14px">

          <b style="font-size:18px">
            ${callsign}
          </b>

          <br><br>

          <b>Distance:</b>
          ${distance.toFixed(1)} NM

          <br>

          <b>Altitude:</b>
          ${altitude}

          <br>

          <b>Speed:</b>
          ${speed}

          <br>

          <b>Heading:</b>
          ${heading.toFixed(0)}°

          <br>

          <b>Squawk:</b>
          ${squawk}

          <br>

          <b>Position:</b>
          ${lat.toFixed(4)},
          ${lon.toFixed(4)}

        </div>

      `);


      /* ---------------------------------------
         ENTRY DETECTION
         --------------------------------------- */

      if (
        monitoring &&
        inside &&
        !previousAircraft.has(id)
      ) {

        console.log(
          "AIRCRAFT ENTERED RADIUS:",
          callsign
        );

        playSiren();

        status.textContent =
          "AIRCRAFT ENTERED RADIUS!";
      }

    }


    /* -----------------------------------------
       Save current aircraft
       ----------------------------------------- */

    previousAircraft =
      currentAircraft;


    /* -----------------------------------------
       Statistics
       ----------------------------------------- */

    stats.innerHTML =

      "API aircraft: " +
      aircraft.length +

      "<br>" +

      "Inside siren radius: " +
      insideCount +

      "<br>" +

      "Location: " +
      latitude.toFixed(4) +
      ", " +
      longitude.toFixed(4);


    if (monitoring) {

      if (
        insideCount === 0
      ) {

        status.textContent =
          "Monitoring — no aircraft inside radius.";

      } else {

        status.textContent =
          "Monitoring — " +
          insideCount +
          " aircraft inside radius.";
      }
    }


  } catch (error) {

    console.error(
      "Aircraft error:",
      error
    );


    status.textContent =
      "LOAD FAILED";


    errorBox.textContent =
      String(error);
  }
}


/* =========================================================
   START MONITORING
   ========================================================= */

function startMonitoring() {

  if (monitoring) {
    return;
  }


  /*
    Unlock iPad audio
  */

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    audioContext.resume();
  }


  monitoring = true;


  status.textContent =
    "Monitoring...";


  fetchAircraft();


  updateTimer =
    setInterval(
      fetchAircraft,
      UPDATE_INTERVAL
    );
}


/* =========================================================
   STOP MONITORING
   ========================================================= */

function stopMonitoring() {

  monitoring = false;


  if (updateTimer) {

    clearInterval(
      updateTimer
    );

    updateTimer = null;
  }


  status.textContent =
    "Monitoring stopped.";
}


/* =========================================================
   BUTTONS
   ========================================================= */

document
  .getElementById(
    "locationButton"
  )
  .addEventListener(
    "click",
    getLocation
  );


document
  .getElementById(
    "startButton"
  )
  .addEventListener(
    "click",
    startMonitoring
  );


document
  .getElementById(
    "stopButton"
  )
  .addEventListener(
    "click",
    stopMonitoring
  );


document
  .getElementById(
    "testButton"
  )
  .addEventListener(
    "click",
    playSiren
  );


/* =========================================================
   INITIALIZATION
   ========================================================= */

updateUserMarker();

getLocation();

</script>

</body>
</html>
