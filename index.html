<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aircraft Siren Radar</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #panel {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      width: min(360px, calc(100vw - 24px));
      background: rgba(15, 15, 15, 0.94);
      border-radius: 14px;
      padding: 15px;
      box-sizing: border-box;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    #title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .row {
      margin-top: 10px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 12px;
      margin-top: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #locationButton {
      background: #1976d2;
      color: white;
    }

    #sirenButton {
      background: #b71c1c;
      color: white;
    }

    #monitorButton {
      background: #2e7d32;
      color: white;
    }

    #stopButton {
      background: #555;
      color: white;
    }

    input[type="range"] {
      width: 100%;
    }

    #radiusValue {
      font-size: 18px;
      font-weight: bold;
    }

    #status {
      margin-top: 10px;
      padding: 9px;
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.35;
    }

    #aircraftCount {
      margin-top: 7px;
      font-size: 15px;
    }

    #alertBox {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border-radius: 9px;
      background: #d32f2f;
      font-weight: bold;
      animation: flash 0.8s infinite alternate;
    }

    @keyframes flash {
      from {
        opacity: 1;
      }

      to {
        opacity: 0.55;
      }
    }

    .aircraft-icon {
      background: transparent;
      border: none;
    }

    .plane {
      font-size: 25px;
      transform: rotate(0deg);
      transform-origin: center;
      text-shadow: 0 0 4px black;
    }

    .legend {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div id="panel">

    <div id="title">
      Aircraft Siren Radar
    </div>

    <div class="row">
      Detection radius:
      <span id="radiusValue">25 NM</span>

      <input
        id="radiusSlider"
        type="range"
        min="1"
        max="250"
        value="25"
        step="1"
      >
    </div>

    <button id="locationButton">
      Use My Location
    </button>

    <button id="sirenButton">
      TEST SIREN
    </button>

    <button id="monitorButton">
      START MONITORING
    </button>

    <button id="stopButton">
      STOP MONITORING
    </button>

    <div id="status">
      Waiting for location...
    </div>

    <div id="aircraftCount">
      Aircraft inside radius: 0
    </div>

    <div id="alertBox">
      AIRCRAFT ENTERED DETECTION ZONE
    </div>

    <div class="legend">
      Red circle = actual alert radius
      <br>
      Data source = ADSBao
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    /*
     * ============================================================
     * SETTINGS
     * ============================================================
     */

    const API_BASE =
      "https://adsbao.dev/api/proxy/aircraft/positions";

    const UPDATE_INTERVAL = 10000;

    /*
     * ============================================================
     * MAP
     * ============================================================
     */

    const map = L.map("map").setView(
      [39.96, -83.15],
      8
    );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    /*
     * ============================================================
     * VARIABLES
     * ============================================================
     */

    let userLat = null;
    let userLon = null;

    let radiusNM = 25;

    let userMarker = null;
    let radiusCircle = null;

    let aircraftMarkers = new Map();

    let previousAircraftInside = new Set();

    let monitoring = false;

    let updateTimer = null;

    let audioContext = null;


    /*
     * ============================================================
     * UI ELEMENTS
     * ============================================================
     */

    const radiusSlider =
      document.getElementById("radiusSlider");

    const radiusValue =
      document.getElementById("radiusValue");

    const status =
      document.getElementById("status");

    const aircraftCount =
      document.getElementById("aircraftCount");

    const alertBox =
      document.getElementById("alertBox");


    /*
     * ============================================================
     * RADIUS SLIDER
     * ============================================================
     */

    radiusSlider.addEventListener(
      "input",
      () => {

        radiusNM =
          Number(radiusSlider.value);

        radiusValue.textContent =
          radiusNM + " NM";

        updateRadiusCircle();

        if (monitoring) {
          fetchAircraft();
        }

      }
    );


    /*
     * ============================================================
     * LOCATION
     * ============================================================
     */

    document
      .getElementById("locationButton")
      .addEventListener(
        "click",
        getLocation
      );


    function getLocation() {

      status.textContent =
        "Requesting your location...";

      if (!navigator.geolocation) {

        status.textContent =
          "Geolocation is not supported by this browser.";

        return;
      }

      navigator.geolocation.getCurrentPosition(

        position => {

          userLat =
            position.coords.latitude;

          userLon =
            position.coords.longitude;

          map.setView(
            [userLat, userLon],
            9
          );

          createUserMarker();

          updateRadiusCircle();

          status.textContent =
            "Location acquired.";

          if (monitoring) {
            fetchAircraft();
          }

        },

        error => {

          status.textContent =
            "Location error: " +
            error.message;

        },

        {
          enableHighAccuracy: true,
          maximumAge: 30000,
          timeout: 15000
        }

      );

    }


    /*
     * ============================================================
     * USER MARKER
     * ============================================================
     */

    function createUserMarker() {

      if (userMarker) {
        map.removeLayer(userMarker);
      }

      userMarker =
        L.marker(
          [userLat, userLon]
        )
        .addTo(map)
        .bindPopup(
          "Your location"
        );

    }


    /*
     * ============================================================
     * RADIUS CIRCLE
     * ============================================================
     */

    function updateRadiusCircle() {

      if (
        userLat === null ||
        userLon === null
      ) {
        return;
      }

      if (radiusCircle) {
        map.removeLayer(radiusCircle);
      }

      radiusCircle =
        L.circle(
          [userLat, userLon],
          {
            radius:
              radiusNM * 1852,

            color: "red",

            weight: 2,

            fillColor: "red",

            fillOpacity: 0.08
          }
        )
        .addTo(map);

    }


    /*
     * ============================================================
     * DISTANCE CALCULATION
     * ============================================================
     */

    function distanceNM(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 3440.069;

      const toRad =
        degrees =>
          degrees * Math.PI / 180;

      const dLat =
        toRad(lat2 - lat1);

      const dLon =
        toRad(lon2 - lon1);

      const a =
        Math.sin(dLat / 2) ** 2 +

        Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) ** 2;

      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );

      return R * c;

    }


    /*
     * ============================================================
     * FETCH AIRCRAFT
     * ============================================================
     */

    async function fetchAircraft() {

      if (
        userLat === null ||
        userLon === null
      ) {

        status.textContent =
          "Set your location first.";

        return;

      }

      const url =
        API_BASE +
        "/" +
        encodeURIComponent(userLat) +
        "/" +
        encodeURIComponent(userLon) +
        "/" +
        encodeURIComponent(radiusNM);

      try {

        status.textContent =
          "Getting aircraft...";

        const response =
          await fetch(url, {
            cache: "no-store"
          });

        if (!response.ok) {

          throw new Error(
            "API HTTP " +
            response.status
          );

        }

        const data =
          await response.json();

        const aircraft =
          Array.isArray(data.ac)
            ? data.ac
            : [];

        processAircraft(
          aircraft
        );

        status.textContent =
          "Last update: " +
          new Date().toLocaleTimeString();

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "Aircraft data error: " +
          error.message;

      }

    }


    /*
     * ============================================================
     * PROCESS AIRCRAFT
     * ============================================================
     */

    function processAircraft(
      aircraft
    ) {

      const currentAircraft =
        new Set();

      let insideCount = 0;

      for (
        const plane of aircraft
      ) {

        if (
          typeof plane.lat !== "number" ||
          typeof plane.lon !== "number"
        ) {
          continue;
        }

        const id =
          plane.hex ||
          plane.icao24 ||
          plane.flight ||
          (
            plane.lat +
            "," +
            plane.lon
          );

        const distance =
          distanceNM(
            userLat,
            userLon,
            plane.lat,
            plane.lon
          );

        /*
         * Ignore aircraft outside the
         * actual radius.
         */

        if (
          distance > radiusNM
        ) {

          removeAircraftMarker(id);

          continue;

        }

        insideCount++;

        currentAircraft.add(id);

        updateAircraftMarker(
          id,
          plane,
          distance
        );

        /*
         * New aircraft entering the
         * zone.
         */

        if (
          !previousAircraftInside.has(id)
        ) {

          triggerAircraftAlert(
            plane,
            distance
          );

        }

      }

      /*
       * Remove aircraft that disappeared
       * from the current API response.
       */

      for (
        const id of aircraftMarkers.keys()
      ) {

        if (
          !currentAircraft.has(id)
        ) {

          removeAircraftMarker(id);

        }

      }

      previousAircraftInside =
        currentAircraft;

      aircraftCount.textContent =
        "Aircraft inside radius: " +
        insideCount;

    }


    /*
     * ============================================================
     * AIRCRAFT MARKER
     * ============================================================
     */

    function updateAircraftMarker(
      id,
      plane,
      distance
    ) {

      const heading =
        Number.isFinite(
          Number(plane.track)
        )
          ? Number(plane.track)
          : 0;

      const callsign =
        (
          plane.flight ||
          plane.callsign ||
          "Unknown"
        )
        .trim();

      const altitude =
        plane.alt_baro ??
        plane.alt_geom ??
        "Unknown";

      const speed =
        plane.gs ??
        "Unknown";

      const popup =

        "<b>" +
        callsign +
        "</b>" +

        "<br>ICAO: " +
        (plane.hex || "Unknown") +

        "<br>Distance: " +
        distance.toFixed(1) +
        " NM" +

        "<br>Altitude: " +
        altitude +
        " ft" +

        "<br>Ground speed: " +
        speed +
        " kt" +

        "<br>Heading: " +
        heading.toFixed(0) +
        "°";


      if (
        aircraftMarkers.has(id)
      ) {

        const marker =
          aircraftMarkers.get(id);

        marker.setLatLng(
          [plane.lat, plane.lon]
        );

        marker.setRotationAngle =
          heading;

        marker.setPopupContent(
          popup
        );

        return;

      }


      const icon =
        L.divIcon({

          className:
            "aircraft-icon",

          html:
            `<div
              class="plane"
              style="transform: rotate(${heading}deg)"
            >✈</div>`,

          iconSize:
            [30, 30],

          iconAnchor:
            [15, 15]

        });


      const marker =
        L.marker(
          [plane.lat, plane.lon],
          {
            icon
          }
        )
        .addTo(map)
        .bindPopup(popup);


      aircraftMarkers.set(
        id,
        marker
      );

    }


    /*
     * ============================================================
     * REMOVE AIRCRAFT
     * ============================================================
     */

    function removeAircraftMarker(
      id
    ) {

      const marker =
        aircraftMarkers.get(id);

      if (!marker) {
        return;
      }

      map.removeLayer(
        marker
      );

      aircraftMarkers.delete(
        id
      );

    }


    /*
     * ============================================================
     * START MONITORING
     * ============================================================
     */

    document
      .getElementById("monitorButton")
      .addEventListener(
        "click",
        startMonitoring
      );


    function startMonitoring() {

      if (
        userLat === null ||
        userLon === null
      ) {

        getLocation();

        return;

      }

      if (monitoring) {
        return;
      }

      /*
       * Browser audio requires a user
       * interaction before sound can play.
       */

      initializeAudio();

      monitoring = true;

      status.textContent =
        "Monitoring aircraft...";

      fetchAircraft();

      updateTimer =
        setInterval(
          fetchAircraft,
          UPDATE_INTERVAL
        );

    }


    /*
     * ============================================================
     * STOP MONITORING
     * ============================================================
     */

    document
      .getElementById("stopButton")
      .addEventListener(
        "click",
        stopMonitoring
      );


    function stopMonitoring() {

      monitoring = false;

      if (updateTimer) {

        clearInterval(
          updateTimer
        );

        updateTimer = null;

      }

      status.textContent =
        "Monitoring stopped.";

    }


    /*
     * ============================================================
     * AUDIO
     * ============================================================
     */

    function initializeAudio() {

      if (!audioContext) {

        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }

      if (
        audioContext.state ===
        "suspended"
      ) {

        audioContext.resume();

      }

    }


    /*
     * ============================================================
     * AIR-RAID SIREN
     * ============================================================
     */

    function playSiren() {

      initializeAudio();

      const ctx =
        audioContext;

      const oscillator =
        ctx.createOscillator();

      const gain =
        ctx.createGain();

      oscillator.type =
        "sawtooth";

      oscillator.connect(
        gain
      );

      gain.connect(
        ctx.destination
      );

      const now =
        ctx.currentTime;

      gain.gain.setValueAtTime(
        0.0001,
        now
      );

      gain.gain.exponentialRampToValueAtTime(
        0.45,
        now + 0.08
      );

      oscillator.start(
        now
      );


      /*
       * Four seconds of rising/falling
       * air-raid siren tone.
       */

      for (
        let i = 0;
        i < 8;
        i++
      ) {

        const start =
          now +
          i * 0.5;

        oscillator.frequency.setValueAtTime(
          550,
          start
        );

        oscillator.frequency.linearRampToValueAtTime(
          1000,
          start + 0.25
        );

        oscillator.frequency.linearRampToValueAtTime(
          550,
          start + 0.5
        );

      }


      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 4.1
      );

      oscillator.stop(
        now + 4.2
      );

    }


    /*
     * ============================================================
     * AIRCRAFT ALERT
     * ============================================================
     */

    function triggerAircraftAlert(
      plane,
      distance
    ) {

      alertBox.style.display =
        "block";

      const callsign =
        (
          plane.flight ||
          plane.callsign ||
          "Unknown aircraft"
        )
        .trim();

      alertBox.textContent =
        "AIRCRAFT ENTERED ZONE: " +
        callsign +
        " — " +
        distance.toFixed(1) +
        " NM";

      playSiren();

      setTimeout(
        () => {

          alertBox.style.display =
            "none";

        },
        5000
      );

    }


    /*
     * ============================================================
     * TEST SIREN BUTTON
     * ============================================================
     */

    document
      .getElementById("sirenButton")
      .addEventListener(
        "click",
        () => {

          initializeAudio();

          playSiren();

        }
      );


    /*
     * ============================================================
     * INITIAL STATE
     * ============================================================
     */

    radiusValue.textContent =
      radiusNM + " NM";

  </script>

</body>
</html>
