<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Aircraft Siren</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #111;
        color: white;
    }

    #map {
        height: 55vh;
        width: 100%;
    }

    #controls {
        padding: 15px;
        background: #181818;
    }

    h1 {
        margin: 0 0 12px;
        font-size: 24px;
    }

    label {
        display: block;
        margin-top: 12px;
        margin-bottom: 5px;
    }

    input[type="number"] {
        width: 48%;
        padding: 10px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #555;
        background: #222;
        color: white;
    }

    input[type="range"] {
        width: 100%;
    }

    button {
        width: 100%;
        padding: 13px;
        margin-top: 10px;
        border: none;
        border-radius: 9px;
        font-size: 17px;
        font-weight: bold;
    }

    #locationButton {
        background: #2878ff;
        color: white;
    }

    #enableButton {
        background: #20a060;
        color: white;
    }

    #testButton {
        background: #555;
        color: white;
    }

    #status {
        margin-top: 12px;
        padding: 10px;
        background: #252525;
        border-radius: 8px;
        font-size: 14px;
    }

    #aircraftList {
        max-height: 250px;
        overflow-y: auto;
        margin-top: 10px;
    }

    .aircraft {
        padding: 10px;
        border-bottom: 1px solid #333;
    }

    .sirenOn {
        background: #801515 !important;
    }

    .plane-icon {
        font-size: 25px;
        text-align: center;
    }
</style>
</head>

<body>

<div id="map"></div>

<div id="controls">

    <h1>Aircraft Siren</h1>

    <label>Latitude</label>
    <input id="lat" type="number" step="0.000001">

    <input id="lon" type="number" step="0.000001">

    <button id="locationButton">
        Use My Location
    </button>

    <label>
        Alert radius:
        <span id="radiusText">25</span> NM
    </label>

    <input id="radius"
           type="range"
           min="1"
           max="250"
           value="25">

    <label>
        Siren volume:
        <span id="volumeText">70</span>%
    </label>

    <input id="volume"
           type="range"
           min="0"
           max="100"
           value="70">

    <button id="enableButton">
        Enable Siren
    </button>

    <button id="testButton">
        Test Siren
    </button>

    <div id="status">
        Waiting for location...
    </div>

    <div id="aircraftList"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const WORKER =
    "https://aircraft-siren-api.evangockerman.workers.dev/";

let map;
let homeMarker;
let radiusCircle;

let homeLat = 39.96;
let homeLon = -83.15;

let aircraftMarkers = {};

let audioContext = null;
let sirenEnabled = false;
let sirenGain = null;

let insideAircraft = new Set();

let lastAircraftData = [];


/* =========================
   MAP
========================= */

map = L.map("map").setView(
    [homeLat, homeLon],
    9
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);


/* =========================
   LOCATION
========================= */

document.getElementById("lat").value =
    homeLat;

document.getElementById("lon").value =
    homeLon;

function updateLocation() {

    homeLat =
        parseFloat(
            document.getElementById("lat").value
        );

    homeLon =
        parseFloat(
            document.getElementById("lon").value
        );

    if (
        !Number.isFinite(homeLat) ||
        !Number.isFinite(homeLon)
    ) {
        return;
    }

    map.setView(
        [homeLat, homeLon],
        10
    );

    if (homeMarker) {
        map.removeLayer(homeMarker);
    }

    if (radiusCircle) {
        map.removeLayer(radiusCircle);
    }

    homeMarker =
        L.marker([
            homeLat,
            homeLon
        ])
        .addTo(map)
        .bindPopup("Alert location");

    radiusCircle =
        L.circle(
            [homeLat, homeLon],
            {
                radius:
                    getRadius() * 1852,

                color: "red",
                fillOpacity: 0.08
            }
        )
        .addTo(map);

    loadAircraft();
}

document
    .getElementById("lat")
    .addEventListener(
        "change",
        updateLocation
    );

document
    .getElementById("lon")
    .addEventListener(
        "change",
        updateLocation
    );


document
    .getElementById("locationButton")
    .addEventListener(
        "click",
        () => {

            if (!navigator.geolocation) {

                setStatus(
                    "Location is not supported."
                );

                return;
            }

            navigator.geolocation.getCurrentPosition(
                position => {

                    document.getElementById(
                        "lat"
                    ).value =
                        position.coords.latitude;

                    document.getElementById(
                        "lon"
                    ).value =
                        position.coords.longitude;

                    updateLocation();

                },

                error => {

                    setStatus(
                        "Location failed: " +
                        error.message
                    );

                },

                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 30000
                }
            );

        }
    );


/* =========================
   RADIUS
========================= */

function getRadius() {

    return parseFloat(
        document.getElementById("radius").value
    );
}

document
    .getElementById("radius")
    .addEventListener(
        "input",
        () => {

            const r =
                getRadius();

            document.getElementById(
                "radiusText"
            ).textContent = r;

            if (radiusCircle) {

                radiusCircle.setRadius(
                    r * 1852
                );

            }

            loadAircraft();
        }
    );


/* =========================
   VOLUME
========================= */

function getVolume() {

    return (
        parseFloat(
            document.getElementById("volume").value
        ) / 100
    );
}

document
    .getElementById("volume")
    .addEventListener(
        "input",
        () => {

            document.getElementById(
                "volumeText"
            ).textContent =
                document.getElementById(
                    "volume"
                ).value;

            if (sirenGain) {

                sirenGain.gain.value =
                    getVolume();

            }

        }
    );


/* =========================
   AUDIO
========================= */

async function enableAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        await audioContext.resume();

    }

    sirenEnabled = true;

    document.getElementById(
        "enableButton"
    ).textContent =
        "Siren Enabled";

    document.getElementById(
        "enableButton"
    ).classList.add(
        "sirenOn"
    );

    setStatus(
        "Siren enabled. Monitoring aircraft..."
    );
}


document
    .getElementById("enableButton")
    .addEventListener(
        "click",
        enableAudio
    );


function playSiren(
    seconds = 4
) {

    if (!audioContext) {
        return;
    }

    if (
        audioContext.state ===
        "suspended"
    ) {
        audioContext.resume();
    }

    const now =
        audioContext.currentTime;

    const oscillator =
        audioContext.createOscillator();

    sirenGain =
        audioContext.createGain();

    oscillator.type = "sawtooth";

    oscillator.frequency.setValueAtTime(
        450,
        now
    );

    oscillator.frequency.linearRampToValueAtTime(
        850,
        now + 1.5
    );

    oscillator.frequency.linearRampToValueAtTime(
        450,
        now + 3
    );

    oscillator.frequency.linearRampToValueAtTime(
        850,
        now + 4.5
    );

    sirenGain.gain.setValueAtTime(
        0,
        now
    );

    sirenGain.gain.linearRampToValueAtTime(
        getVolume(),
        now + 0.1
    );

    sirenGain.gain.setValueAtTime(
        getVolume(),
        now + seconds - 0.2
    );

    sirenGain.gain.linearRampToValueAtTime(
        0,
        now + seconds
    );

    oscillator.connect(
        sirenGain
    );

    sirenGain.connect(
        audioContext.destination
    );

    oscillator.start(now);

    oscillator.stop(
        now + seconds
    );
}


document
    .getElementById("testButton")
    .addEventListener(
        "click",
        async () => {

            await enableAudio();

            playSiren(5);

        }
    );


/* =========================
   DISTANCE
========================= */

function distanceNM(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 3440.065;

    const dLat =
        (
            (lat2 - lat1)
            * Math.PI
        ) / 180;

    const dLon =
        (
            (lon2 - lon1)
            * Math.PI
        ) / 180;

    const a =
        Math.sin(dLat / 2) ** 2 +

        Math.cos(
            lat1 * Math.PI / 180
        ) *

        Math.cos(
            lat2 * Math.PI / 180
        ) *

        Math.sin(dLon / 2) ** 2;

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}


/* =========================
   STATUS
========================= */

function setStatus(text) {

    document.getElementById(
        "status"
    ).textContent = text;

}


/* =========================
   AIRCRAFT
========================= */

async function loadAircraft() {

    if (
        !Number.isFinite(homeLat) ||
        !Number.isFinite(homeLon)
    ) {
        return;
    }

    const radius =
        getRadius();

    const url =
        WORKER +
        "?lat=" +
        encodeURIComponent(homeLat) +
        "&lon=" +
        encodeURIComponent(homeLon) +
        "&dist=" +
        encodeURIComponent(radius);

    try {

        setStatus(
            "Loading aircraft..."
        );

        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Worker HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        const aircraft =
            Array.isArray(data.ac)
                ? data.ac
                : [];

        lastAircraftData =
            aircraft;

        displayAircraft(
            aircraft
        );

        setStatus(
            aircraft.length +
            " aircraft within " +
            radius +
            " NM"
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "ADS-B ERROR: " +
            error.message
        );

    }

}


/* =========================
   DISPLAY
========================= */

function displayAircraft(
    aircraft
) {

    const currentInside =
        new Set();

    const list =
        document.getElementById(
            "aircraftList"
        );

    list.innerHTML = "";

    const activeMarkers =
        new Set();


    aircraft.forEach(
        plane => {

            if (
                plane.lat == null ||
                plane.lon == null
            ) {
                return;
            }

            const lat =
                Number(plane.lat);

            const lon =
                Number(plane.lon);

            if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lon)
            ) {
                return;
            }

            const hex =
                plane.hex ||
                (
                    plane.icao ||
                    Math.random()
                );

            const distance =
                distanceNM(
                    homeLat,
                    homeLon,
                    lat,
                    lon
                );

            if (
                distance >
                getRadius()
            ) {
                return;
            }

            currentInside.add(
                hex
            );

            activeMarkers.add(
                hex
            );


            /* =================
               MARKER
            ================= */

            if (
                !aircraftMarkers[hex]
            ) {

                const icon =
                    L.divIcon({
                        className: "",
                        html:
                            '<div class="plane-icon">✈</div>',
                        iconSize: [
                            30,
                            30
                        ],
                        iconAnchor: [
                            15,
                            15
                        ]
                    });

                aircraftMarkers[hex] =
                    L.marker(
                        [lat, lon],
                        {
                            icon: icon
                        }
                    )
                    .addTo(map);

            } else {

                aircraftMarkers[hex]
                    .setLatLng(
                        [lat, lon]
                    );

            }


            const callsign =
                (
                    plane.flight ||
                    plane.callsign ||
                    "Unknown"
                ).trim();

            const altitude =
                plane.alt_baro != null
                    ? Number(
                        plane.alt_baro
                      ).toLocaleString()
                      + " ft"
                    : "Unknown";

            const speed =
                plane.gs != null
                    ? Math.round(
                        Number(plane.gs)
                      )
                      + " kt"
                    : "Unknown";

            aircraftMarkers[hex]
                .bindPopup(
                    "<b>" +
                    callsign +
                    "</b><br>" +

                    "Distance: " +
                    distance.toFixed(1) +
                    " NM<br>" +

                    "Altitude: " +
                    altitude +
                    "<br>" +

                    "Speed: " +
                    speed
                );


            /* =================
               LIST
            ================= */

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "aircraft";

            item.innerHTML =
                "<b>" +
                callsign +
                "</b><br>" +

                distance.toFixed(1) +
                " NM · " +

                altitude +
                " · " +

                speed;

            list.appendChild(
                item
            );

        }
    );


    /* =========================
       REMOVE OLD MARKERS
    ========================= */

    Object.keys(
        aircraftMarkers
    ).forEach(
        hex => {

            if (
                !activeMarkers.has(hex)
            ) {

                map.removeLayer(
                    aircraftMarkers[hex]
                );

                delete aircraftMarkers[
                    hex
                ];

            }

        }
    );


    /* =========================
       NEW AIRCRAFT ALERT
    ========================= */

    if (
        sirenEnabled
    ) {

        const newlyEntered =
            [...currentInside]
            .filter(
                hex =>
                    !insideAircraft.has(
                        hex
                    )
            );

        if (
            newlyEntered.length > 0
        ) {

            playSiren(6);

            setStatus(
                "AIRCRAFT ENTERED ALERT ZONE — " +
                newlyEntered.length +
                " new aircraft"
            );

        }

    }

    insideAircraft =
        currentInside;

}


/* =========================
   START
========================= */

updateLocation();

loadAircraft();

setInterval(
    loadAircraft,
    10000
);

</script>

</body>
</html>
