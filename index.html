<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aircraft Siren</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
  html, body {
    margin: 0;
    height: 100%;
    font-family: Arial, sans-serif;
  }

  #map {
    height: 100%;
  }

  #panel {
    position: absolute;
    z-index: 1000;
    top: 10px;
    left: 10px;
    width: 300px;
    background: white;
    padding: 14px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.3);
  }

  h2 {
    margin: 0 0 10px;
  }

  button {
    width: 100%;
    padding: 10px;
    margin-top: 7px;
    font-size: 16px;
    border: 0;
    border-radius: 8px;
    background: #222;
    color: white;
  }

  button:active {
    transform: scale(.98);
  }

  input[type="range"] {
    width: 100%;
  }

  #status {
    margin-top: 10px;
    font-weight: bold;
  }

  #debug {
    margin-top: 8px;
    font-size: 12px;
    word-break: break-word;
    max-height: 150px;
    overflow-y: auto;
  }
</style>
</head>

<body>

<div id="panel">
  <h2>Aircraft Siren</h2>

  <div>
    Siren radius:
    <strong><span id="radiusValue">25</span> NM</strong>
  </div>

  <input
    id="radius"
    type="range"
    min="1"
    max="250"
    value="25"
  >

  <button id="locationBtn">Use My Location</button>
  <button id="startBtn">Start Monitoring</button>
  <button id="stopBtn">Stop Monitoring</button>
  <button id="testBtn">Test Siren</button>

  <div id="status">Waiting...</div>

  <div id="debug">
    API aircraft: 0<br>
    Inside siren radius: 0
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/*
  ==========================================
  AIRCRAFT SIREN
  ==========================================

  Aircraft source:
  ADSBao through your Cloudflare Worker.

  Your Worker:
  https://aircraft-siren-api.evangockerman.workers.dev/

  We are NOT using AvioADSB.
  We are NOT using ADSB.fi directly.
*/

const WORKER =
  "https://aircraft-siren-api.evangockerman.workers.dev/";

const API_RADIUS = 100;

let latitude = 39.96;
let longitude = -83.15;

let monitoring = false;
let timer = null;

let previousAircraft = new Set();

let map = L.map("map").setView(
  [latitude, longitude],
  9
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);

let aircraftLayer = L.layerGroup().addTo(map);

const radiusSlider =
  document.getElementById("radius");

const radiusValue =
  document.getElementById("radiusValue");

const status =
  document.getElementById("status");

const debug =
  document.getElementById("debug");

radiusSlider.addEventListener("input", () => {
  radiusValue.textContent = radiusSlider.value;
});


/*
  ------------------------------------------
  DISTANCE
  ------------------------------------------
*/

function distanceNM(lat1, lon1, lat2, lon2) {

  const R = 3440.065;

  const p1 = lat1 * Math.PI / 180;
  const p2 = lat2 * Math.PI / 180;

  const dp =
    (lat2 - lat1) * Math.PI / 180;

  const dl =
    (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dp / 2) ** 2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl / 2) ** 2;

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/*
  ------------------------------------------
  SIREN
  ------------------------------------------
*/

let audioContext = null;

function playSiren() {

  if (!audioContext) {
    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = "sawtooth";

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  gain.gain.value = 0.15;

  const start =
    audioContext.currentTime;

  oscillator.start(start);

  /*
    Old air-raid-siren style sweep
  */

  for (let i = 0; i < 8; i++) {

    const t = start + i * 1.2;

    oscillator.frequency.setValueAtTime(
      500,
      t
    );

    oscillator.frequency.linearRampToValueAtTime(
      1000,
      t + 0.6
    );

    oscillator.frequency.linearRampToValueAtTime(
      500,
      t + 1.2
    );
  }

  oscillator.stop(start + 9.6);
}


/*
  ------------------------------------------
  LOCATION
  ------------------------------------------
*/

function getLocation() {

  status.textContent =
    "Getting location...";

  navigator.geolocation.getCurrentPosition(
    position => {

      latitude =
        position.coords.latitude;

      longitude =
        position.coords.longitude;

      map.setView(
        [latitude, longitude],
        9
      );

      L.marker([
        latitude,
        longitude
      ])
      .addTo(map)
      .bindPopup("Your location");

      status.textContent =
        "Location found.";

      fetchAircraft();

    },

    error => {

      status.textContent =
        "Location failed. Using default location.";

      fetchAircraft();

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 60000
    }
  );
}


/*
  ------------------------------------------
  AIRCRAFT FETCH
  ------------------------------------------
*/

async function fetchAircraft() {

  try {

    status.textContent =
      "Loading aircraft...";

    /*
      IMPORTANT:

      Browser
          ↓
      Cloudflare Worker
          ↓
      ADSBao
          ↓
      ADS-B sources
    */

    const url =
      WORKER +
      "?lat=" +
      encodeURIComponent(latitude) +
      "&lon=" +
      encodeURIComponent(longitude) +
      "&dist=" +
      API_RADIUS;

    console.log(
      "Aircraft request:",
      url
    );

    const response =
      await fetch(url, {
        cache: "no-store"
      });

    if (!response.ok) {

      throw new Error(
        "Worker HTTP " +
        response.status
      );
    }

    const data =
      await response.json();

    console.log(
      "Worker response:",
      data
    );

    /*
      If Worker returns an error
    */

    if (data.error) {

      throw new Error(
        data.error
      );
    }

    /*
      ADSBao normally returns:

      {
        ac: [...]
      }

      But keep support for other formats.
    */

    let aircraft = [];

    if (Array.isArray(data.ac)) {
      aircraft = data.ac;
    }

    else if (
      Array.isArray(data.aircraft)
    ) {
      aircraft = data.aircraft;
    }

    else if (
      Array.isArray(data.positions)
    ) {
      aircraft = data.positions;
    }

    else if (
      Array.isArray(data.states)
    ) {
      aircraft = data.states;
    }

    /*
      Clear old markers
    */

    aircraftLayer.clearLayers();

    let inside = 0;

    const currentAircraft =
      new Set();

    for (const plane of aircraft) {

      /*
        ADS-B Exchange-style fields
      */

      const lat =
        Number(
          plane.lat ??
          plane.latitude
        );

      const lon =
        Number(
          plane.lon ??
          plane.longitude
        );

      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {
        continue;
      }

      const distance =
        distanceNM(
          latitude,
          longitude,
          lat,
          lon
        );

      /*
        Show EVERY plane returned
        by the API.
      */

      const callsign =
        plane.flight ||
        plane.callsign ||
        plane.hex ||
        plane.icao ||
        "Unknown";

      const altitude =
        plane.alt_baro ??
        plane.altitude ??
        plane.alt ??
        "Unknown";

      const marker =
        L.circleMarker(
          [lat, lon],
          {
            radius: 6
          }
        ).addTo(aircraftLayer);

      marker.bindPopup(
        "<b>" +
        callsign +
        "</b><br>" +
        "Distance: " +
        distance.toFixed(1) +
        " NM<br>" +
        "Altitude: " +
        altitude
      );

      /*
        Determine whether it is
        inside the user's siren radius.
      */

      if (
        distance <=
        Number(radiusSlider.value)
      ) {

        inside++;

        const id =
          String(
            plane.hex ??
            plane.icao ??
            plane.flight ??
            lat + "," + lon
          );

        currentAircraft.add(id);

        /*
          Only sound when a plane
          ENTERS the radius.
        */

        if (
          monitoring &&
          !previousAircraft.has(id)
        ) {

          playSiren();

          status.textContent =
            "AIRCRAFT ENTERED RADIUS";
        }
      }
    }

    previousAircraft =
      currentAircraft;

    debug.innerHTML =
      "API aircraft: " +
      aircraft.length +
      "<br>" +
      "Inside siren radius: " +
      inside +
      "<br>" +
      "Location: " +
      latitude.toFixed(4) +
      ", " +
      longitude.toFixed(4);

    if (monitoring) {

      if (inside === 0) {

        status.textContent =
          "Monitoring — no aircraft inside radius.";

      } else {

        status.textContent =
          "Monitoring — " +
          inside +
          " aircraft inside radius.";
      }
    }

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "LOAD FAILED";

    debug.innerHTML =
      "<b>Error:</b><br>" +
      String(error);
  }
}


/*
  ------------------------------------------
  START / STOP
  ------------------------------------------
*/

function startMonitoring() {

  if (monitoring) {
    return;
  }

  /*
    Unlock audio on iPad/iPhone
  */

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    audioContext.resume();
  }

  monitoring = true;

  status.textContent =
    "Monitoring...";

  fetchAircraft();

  timer =
    setInterval(
      fetchAircraft,
      10000
    );
}


function stopMonitoring() {

  monitoring = false;

  if (timer) {

    clearInterval(timer);

    timer = null;
  }

  status.textContent =
    "Monitoring stopped.";
}


/*
  ------------------------------------------
  BUTTONS
  ------------------------------------------
*/

document
  .getElementById("locationBtn")
  .addEventListener(
    "click",
    getLocation
  );

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startMonitoring
  );

document
  .getElementById("stopBtn")
  .addEventListener(
    "click",
    stopMonitoring
  );

document
  .getElementById("testBtn")
  .addEventListener(
    "click",
    playSiren
  );


/*
  ------------------------------------------
  INITIAL LOAD
  ------------------------------------------
*/

getLocation();

</script>

</body>
</html>
